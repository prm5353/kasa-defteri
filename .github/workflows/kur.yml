name: Kurları güncelle
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: kur
jobs:
  kur:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Harem Altın alış fiyatlarını çek
        run: python3 tools/kur.py
      - name: data dalına yaz
        run: |
          mkdir -p /tmp/out && cp prices.json /tmp/out/
          cd /tmp/out
          git init -q -b data
          git config user.name "kur-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git commit -qm "Kurlar $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
