name: fiba-debug
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
      - run: |
          cat > s.py <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(); pg = await b.new_page()
                  seen=[]
                  async def on_resp(r):
                      if r.request.resource_type in ("xhr","fetch","websocket","other"):
                          try: t = await r.text()
                          except Exception: t=''
                          print("RESP", r.request.method, r.status, r.url, len(t))
                          if "/api/" in r.url: print("   REQ", r.request.post_data, " RES", t[:3000])
                          if any(k in t for k in ("XAG","XAU","Gümüş","Altın","ALTIN","GUMUS")): print("   BODY", t[:1500])
                  pg.on("response", lambda r: asyncio.ensure_future(on_resp(r)))
                  pg.on("websocket", lambda ws: print("WS", ws.url))
                  await pg.goto("https://www.fibabanka.com.tr/yatirim/fx-market", wait_until="networkidle", timeout=60000)
                  await pg.wait_for_timeout(5000)
                  srcs = await pg.eval_on_selector_all("script[src]", "e=>e.map(x=>x.src)")
                  import re, urllib.request
                  found=set()
                  for s in srcs:
                      try: js=urllib.request.urlopen(urllib.request.Request(s,headers={"User-Agent":"Mozilla/5.0"}),timeout=20).read().decode("utf-8","ignore")
                      except Exception as e: continue
                      for m in re.findall(r'["`\'](/api/[A-Za-z0-9_/\-]+)', js): found.add(m)
                  print("APIS", sorted(found))
                  for u in ["https://www.fibabanka.com.tr/doviz-kurlari","https://www.fibabanka.com.tr/yatirim/doviz-kurlari","https://www.fibabanka.com.tr/piyasalar"]:
                      try:
                          r=await pg.goto(u, wait_until="networkidle", timeout=40000); print("PAGE",u,r.status if r else None)
                          await pg.wait_for_timeout(3000)
                      except Exception as e: print("PAGEERR",u,e)
                  await b.close()
          asyncio.run(main())
          PY
          python s.py
