name: fiba-debug
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: pip install -q websocket-client
      - run: |
          cat > h.py <<'PY'
          import websocket, json, time
          ws=websocket.create_connection("wss://hrmsocketonly.haremaltin.com/socket.io/?EIO=4&transport=websocket",timeout=20,header=["Origin: https://www.haremaltin.com","User-Agent: Mozilla/5.0"])
          t0=time.time();shown=False
          while time.time()-t0<25:
              m=ws.recv()
              if m.startswith('0'): ws.send('40'); continue
              if m=='2': ws.send('3'); continue
              if m.startswith('42'):
                  e,p=json.loads(m[2:])
                  if e!='price_changed': continue
                  d=p.get('data',{})
                  keys=['ALTIN','KULCEALTIN','CEYREK_YENI','CEYREK_ESKI','USDTRY','EURTRY','GUMUSTRY','XAGUSD','XAUUSD','ONS']
                  print({k:(d[k].get('alis'),d[k].get('satis'),d[k].get('tarih')) for k in keys if k in d})
                  print(sorted(d.keys())[:80]); break
          PY
          python h.py
