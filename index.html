<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kasa Defteri</title>
<meta name="theme-color" content="#0D6A4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kasa Defteri">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: tek sütun mobil uygulama — Ana Sayfa tek bakışta özet; her satıra dokununca alttan detay açılır; altta 5 sekme */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --ink:#15211C; --muted:#5A6A62; --line:#D5DDD8; --chip:#E2EAE5;
  --accent:#0D6A4D; --accent-ink:#FFFFFF; --accent-soft:#D5EBE1;
  --gold:#9C7019; --ok:#2B7A4B; --warn:#B0731B; --crit:#BE3A2C; --plus:#1F7A4A; --inc:#6E9E86; --other:#7A6AA8; --c1:#0D6A4D; --c2:#C2843A; --c3:#4A6FA5; --c4:#B4535D; --c5:#3E9C9C; --c6:#8E7CC3; --c7:#8C8C3A; --c8:#9E6B4F;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#17211D; --ink:#E5EDE8; --muted:#90A298; --line:#293630; --chip:#202D27;
  --accent:#43B98E; --accent-ink:#04120C; --accent-soft:#1B3A2E;
  --gold:#D8AC52; --ok:#52C17F; --warn:#E3A64B; --crit:#EE6B5B; --plus:#5BCB8B; --inc:#3C6E58; --other:#A596D6; --c1:#43B98E; --c2:#E0A456; --c3:#7A9FD6; --c4:#E07B85; --c5:#5CC4C4; --c6:#AE9EE8; --c7:#BDBD5A; --c8:#C9926F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#17211D; --ink:#E5EDE8; --muted:#90A298; --line:#293630; --chip:#202D27;
  --accent:#43B98E; --accent-ink:#04120C; --accent-soft:#1B3A2E;
  --gold:#D8AC52; --ok:#52C17F; --warn:#E3A64B; --crit:#EE6B5B; --plus:#5BCB8B; --inc:#3C6E58; --other:#A596D6; --c1:#43B98E; --c2:#E0A456; --c3:#7A9FD6; --c4:#E07B85; --c5:#5CC4C4; --c6:#AE9EE8; --c7:#BDBD5A; --c8:#C9926F; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;flex:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink)}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.sec h2{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec h2 .sum{font-family:var(--f-body);font-size:16px;font-weight:700}
.sp{flex:1}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.monthbar{display:flex;align-items:center;gap:8px}
.monthbar .m{flex:1;text-align:center;font-family:var(--f-display);font-weight:600;font-size:17px}
.monthbar button{border:0;background:var(--chip);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.hero .lbl{font-size:12.5px;opacity:.85}
.hero .big{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.hero .proj{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--accent-ink) 12%,transparent);border-radius:12px;padding:10px 12px}
.hero .proj .v{font-family:var(--f-display);font-size:22px;font-weight:700}
.hero input[type=date]{background:transparent;border:1px solid color-mix(in srgb,var(--accent-ink) 40%,transparent);color:var(--accent-ink);border-radius:8px;padding:3px 6px;font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding-block:9px;border-top:1px solid var(--line)}
.row:first-child,.daygrp+.row,h2+.row,.small+.row{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap;text-align:right}
.amt.plus{color:var(--plus)}
.amt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.amt .mine{font-family:var(--f-display);font-size:21px;font-weight:700;color:var(--ink)}
.tap{cursor:pointer}
.chev{color:var(--muted);font-size:18px;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--ink);white-space:nowrap}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.crit{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.oth{background:color-mix(in srgb,var(--other) 18%,transparent);color:var(--other)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.crit{background:var(--crit)} .bar i.fut{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding-block:6px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;font-size:14px}
.kv .k{color:var(--muted)}
.kv b{text-align:right}
.box{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.box .tot{font-family:var(--f-display);font-size:22px;font-weight:700}
.split{display:flex;flex-direction:column}
.split .row{padding-block:6px}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink);display:flex;gap:10px;align-items:center}
.steps{display:flex;flex-direction:column;gap:6px}
.steps button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:14px}
.steps button.done{opacity:.55}
.steps button .n{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.steps button.done .n{background:var(--ok);color:var(--accent-ink)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;min-width:0}
.nav button svg{width:22px;height:22px;stroke:currentColor}
.nav button.on{color:var(--accent)}
.fab{position:fixed;z-index:26;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--ink);color:var(--bg);font-size:28px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .bg{position:absolute;inset:0;background:rgba(5,12,9,.5)}
.sheet .card{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{font-family:var(--f-display);font-size:19px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.x{border:0;background:var(--chip);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px;flex:none}
form{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;font-size:16px;color:var(--ink);font-weight:500;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*,.three>*{min-width:0}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;text-align:center;padding:8px 4px;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer;border:0;background:none}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:13px;cursor:pointer}
.menu button b{display:block;font-size:15px}
.menu button span{font-size:13px;color:var(--muted)}
.menu .ic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.menu .ic svg{width:20px;height:20px;stroke:var(--accent)}
.rv{border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:8px}
.rv.new{border-color:var(--warn)} .rv.bad{border-color:var(--crit)} .rv.off{opacity:.55} .rv.oth{border-color:var(--other)}
.rv .h{display:flex;gap:8px;align-items:center}
.rv .h .main{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv select,.rv input[type=number],.rv input[type=date],.rv input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px;font-size:15px;width:100%;min-width:0;color:var(--ink)}
.rv .cb{width:20px;height:20px;accent-color:var(--accent);flex:none}
.mini{font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.ask{font-size:13px;font-weight:600;color:var(--warn)}
.bad-t{font-size:13px;font-weight:600;color:var(--crit)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.daygrp{font-size:12px;font-weight:700;color:var(--muted);padding-top:12px;letter-spacing:.03em}
.catbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:14px;padding-block:6px}
.catbar .bar{grid-column:1/-1;height:6px}
.catbar .subs{grid-column:1/-1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.02em}
.trend{width:100%;height:auto;display:block}
.trend text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cmp div{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.cmp .k{font-size:11.5px;color:var(--muted)}
.cmp .v{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price-best{color:var(--ok);font-weight:700}
.sumline{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding-block:4px;gap:10px}
details summary{cursor:pointer;font-weight:600;font-size:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col{background:var(--bg);border-radius:12px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:3px}
.col .ct{font-family:var(--f-display);font-size:20px;font-weight:700;margin-bottom:4px;white-space:nowrap}
.cl{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;min-width:0}
.cl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--muted)}
.cl b{white-space:nowrap;font-weight:600}
.plan .col{gap:6px;padding:10px 9px}
.pl{display:flex;flex-direction:column;gap:1px;padding-block:4px;border-bottom:1px dashed var(--line)}
.pl:last-of-type{border-bottom:0}
.pl.done{opacity:.6}
.pr{display:flex;justify-content:space-between;gap:6px;font-size:13px;min-width:0}
.pr .pn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr b{white-space:nowrap}
.tg{font-weight:500;color:var(--muted)}
.pd{font-size:11px;color:var(--muted)}
.addl{border:1px dashed var(--line);background:none;border-radius:8px;padding:5px;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;margin-top:4px}
.cols.tot{margin-top:8px}
.cols.tot div{display:flex;justify-content:space-between;font-size:13.5px;padding:0 9px}
.cols.tot span{color:var(--muted)}
.kalan{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.kalan span{font-weight:700;letter-spacing:.06em;font-size:13px}
.kalan b{font-family:var(--f-display);font-size:30px}
.sec.plan{padding-inline:10px}
.plan .cols{gap:6px}
.plan .pr{font-size:15px}
.plan .pr .pn{white-space:normal;overflow:visible;line-height:1.25}
.plan .pd{font-size:12.5px}
.plan .eyebrow{font-size:12.5px}
.plan .cols.tot div{font-size:15px}
.owe{padding-block:8px;border-top:1px solid var(--line)}
.owe:first-of-type{border-top:0}
.grp{font-size:12px;color:var(--muted);font-weight:500}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.pick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lbl2{font-size:13px;font-weight:600;color:var(--muted)}
div.f{display:flex;flex-direction:column;gap:6px}
.catbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.catbtn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catbtn b{color:var(--muted);font-weight:500}
.pop{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.pop .bg{position:absolute;inset:0;background:rgba(5,12,9,.45)}
.popcard{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:80%;overflow:auto;border-radius:20px 20px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pophead{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-family:var(--f-display);font-size:18px}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cg{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 10px;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;min-width:0}
.cg span{color:var(--muted)}
.cg.main{grid-column:1/-1;background:var(--accent-soft);border-color:var(--accent-soft)}
.cg:active{background:var(--accent);color:var(--accent-ink)}
.crow{display:flex;align-items:center;gap:10px;padding-block:11px;border-top:1px solid var(--line)}
.crow:first-of-type,h2+.crow,.small+.crow{border-top:0}
.crow .main{flex:1;min-width:0}
.crow .t{font-weight:700;font-size:15.5px}
.crow .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.ord{display:flex;gap:6px}.ord .x:disabled{opacity:.35}
.catedit{border-top:1px solid var(--line);padding-block:8px}
.catedit summary{display:flex;justify-content:space-between;align-items:center;font-weight:600;list-style:none}
.catedit summary::-webkit-details-marker{display:none}
form.inline{flex-direction:row;gap:8px;margin-top:6px}
form.inline .inp{flex:1;padding:8px 10px;font-size:15px}
.cg.add{border-style:dashed;color:var(--accent);justify-content:center}
.ro{font-size:12.5px;color:var(--muted);background:var(--chip);border-radius:10px;padding:8px 12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
html{padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>

<div class="wrap">

<script>
/* ===================== SABİTLER ===================== */
const ME='me';
const DEFAULT_START='2026-11-09';
const CAT_TREE={
  'Market':[], 'Dışarıda Yemek':[],
  'Araçlarım':['Yakıt','Otopark','Yıkama','Bakım','HGS','Sigorta','Vergiler','Cezalar','Motosiklet','Araç'],
  'Faturalar':['Elektrik','Doğalgaz','Su Kanalizasyon','İnternet','Cep telefonu','Sabit Telefon','Kablo TV','Bina Aidat','Çöp','Diğer'],
  'Ev':['Kira','Bakım-onarım','Mobilya','Diğer'],
  'Alışveriş':['Giyim','Elektronik','Hediye','Kitaplar','Kaan Alp','Diğer'],
  'Kişisel':['Saç bakımı','Spor','Eğitim','Kişisel Seyahat','Avukatlık','Yatırım'],
  'Sağlık':[], 'Gezi':[], 'Tütün':[], 'Nöbet':[], 'Abonelik':[],
  'Ticari Gider':['Eczane','Laboratuvar','Personel Gideri','Sarf Malzeme','Medikal','Diğer'],
  'Banka':['Kredi','Kredi Kartı','Komisyon'],
  'Diğer':[]
};
const INCOME_SRC=['Maaş','Ticari Gelir','Araba taksiti','Temettü Geliri','Banka','Hediyeler','Diğer'];
const ASSET_TYPES={gram:'Gram altın',ceyrek:'Çeyrek altın',yarim:'Yarım altın',tam:'Tam altın',ata:'Ata / Cumhuriyet',usd:'Dolar',eur:'Euro'};
const PGROUPS=['Meyve & sebze','Et & tavuk','Süt & kahvaltılık','Temel gıda','Atıştırmalık','İçecek','Temizlik','Kişisel bakım','Kağıt ürünleri','Bebek','Evcil hayvan','Diğer'];
const AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const AYK=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];

/* ===================== YARDIMCILAR ===================== */
const nf0=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nfq=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:3});
const TL=n=>(n<=-0.5?'−':'')+nf0.format(Math.abs(Math.round(n||0)))+' ₺';
const TL2=n=>(n<0?'−':'')+nf2.format(Math.abs(n||0))+' ₺';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>ymd(new Date());
const dayIn=(y,m,day)=>{const t=new Date(y,m,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return ymd(new Date(t.getFullYear(),t.getMonth(),Math.min(day,last)))};
const addMonths=(s,n)=>{const d=parse(s);return dayIn(d.getFullYear(),d.getMonth()+n,d.getDate())};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmtD=s=>{const d=parse(s);return `${d.getDate()} ${AYK[d.getMonth()]}`};
const fmtDY=s=>{const d=parse(s);return `${d.getDate()} ${AY[d.getMonth()]} ${d.getFullYear()}`};
const monthLabel=k=>{const[y,m]=k.split('-').map(Number);return `${AY[m-1]} ${y}`};
const shiftMonth=(k,n)=>addMonths(k+'-01',n).slice(0,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;let s=String(v??'').trim();if(/,\d{1,3}$/.test(s)&&s.includes('.'))s=s.replace(/\./g,'');s=s.replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0};
const r2=n=>Math.round(n*100)/100;
/* ekrandaki tutarı Türkçe biçime göre çözer: "2.487,50" → 2487.5, "2.487" → 2487, "45,9" → 45.9, "1,250.00" → 1250 */
function trAmount(v){if(typeof v==='number')return isFinite(v)?v:0;let s=String(v??'').replace(/[^\d.,-]/g,'');if(!s)return 0;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>=0&&ld>=0){if(lc>ld)s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}
  else if(lc>=0){s=/^-?\d{1,3}(,\d{3})+$/.test(s)?s.replace(/,/g,''):s.replace(',','.')}
  else if(ld>=0){if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'')}
  const n=parseFloat(s);return isFinite(n)?n:0}
const ls={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function asciiUp(s){const map={'Ç':'C','Ğ':'G','İ':'I','Ö':'O','Ş':'S','Ü':'U'};return String(s||'').toLocaleUpperCase('tr-TR').replace(/[ÇĞİÖŞÜ]/g,c=>map[c])}
function normKey(s){const words=asciiUp(s).replace(/[^A-Z ]+/g,' ').split(/\s+/).filter(w=>w.length>=2&&!['TR','TUR','ISTANBUL','ANKARA','IZMIR','POS','AS','LTD','STI','TIC','SAN','VE','MAGAZACILIK','GIDA'].includes(w));return words.slice(0,2).join(' ')}
const firstWord=s=>normKey(s).split(' ')[0]||'';
const normProd=s=>asciiUp(s).replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const normSize=s=>asciiUp(s).replace(/\s+/g,'').replace(',','.');

/* ===================== DURUM ===================== */
let db=null,base=null,sampleFn=null,sampleCaps=null;
const S={months:{},amonths:{},rmonths:{},tx:[],arch:[],receipts:[],cards:[],accounts:[],persons:[],budgets:[],assets:[],debts:[],plans:[],stmts:[],cats:[],recs:[],
  merch:{},prod:{map:{},alias:{}},prices:{},meta:{},loaded:false,error:null};
let tab=ls.get('kd3_tab','ana');
let viewMonth=today().slice(0,7);
let archMonth=null;
let txWho=ME,txQuery='',archQuery='';
let fisView=ls.get('kd_fis','urun'),fisQuery='';
let RV=null,RC=null;
const START=()=>S.meta.start||DEFAULT_START;
function targetDate(){const v=ls.get('kd3_target','');if(v&&v>=today())return v;const d=new Date();return d.getDate()<20?dayIn(d.getFullYear(),d.getMonth(),20):dayIn(d.getFullYear(),d.getMonth()+1,20)}

const personName=id=>id===ME?'Ben':(S.persons.find(p=>p.id===id)?.name||S.meta.archPeople?.[id]||'Diğer kişi');
const cardById=id=>S.cards.find(c=>c.id===id);
const holderCard=pid=>S.cards.find(c=>c.holderId===pid);
const srcLabel=t=>t.cardId?(cardById(t.cardId)?.name||'Kart'):(t.account||'Nakit');
const srcVal=t=>t.cardId?'c:'+t.cardId:(t.account?'a:'+t.account:'');
const srcParse=v=>{v=String(v||'');if(v.startsWith('c:'))return {cardId:v.slice(2),account:''};if(v.startsWith('a:'))return {cardId:'',account:v.slice(2)};return {cardId:'',account:''}};
const hasDays=c=>c&&c.cutDay>0&&c.dueDay>0;
function catTree(){const t=JSON.parse(JSON.stringify(S.catTree||CAT_TREE));S.cats.forEach(c=>{if(!c.main)return;if(!t[c.main])t[c.main]=[];if(c.sub&&!t[c.main].includes(c.sub))t[c.main].push(c.sub)});return t}
const saveTree=async t=>{S.catTree=t;await put({id:'cattree',k:'cattree',tree:t});for(const c of S.cats)await del(c.id)};
const catVal=(m,s)=>(m||'Diğer')+'|'+(s||'');
const catLabel=(m,s)=>s?`${m} › ${s}`:(m||'Diğer');
const catPromptList=()=>Object.entries(catTree()).flatMap(([m,s])=>[m,...s.map(x=>m+' › '+x)]);
function parseCat(str){if(!str)return null;const[m,s]=String(str).split(/›|\|/).map(x=>x.trim());const t=catTree();if(!t[m])return null;return {category:m,sub:s&&t[m].includes(s)?s:''}}

/* ===================== HESAPLAR ===================== */
function portions(t){
  const n=Math.max(1,Math.round(t.inst||1));const per=t.amount/n;
  if(n===1){const cd=t.cardId?S.cards.find(c=>c.id===t.cardId):null;return [{...t,pdate:t.date,pamount:t.amount,pi:1,pn:1,pcut:cd&&hasDays(cd)?(t.stmtCut||cutFor(cd,t.date)):null}]}
  const done=t.nextDate?Math.max(0,Math.round(t.instDone||0)):0;let first=t.nextDate||t.date;
  const card=t.cardId?S.cards.find(c=>c.id===t.cardId):null;
  /* kesim günü sonradan değiştiyse (25→24) kayıtlı taksit tarihini en yakın kesime oturt */
  if(t.nextDate&&card&&hasDays(card)){const near=cutCands(card,t.nextDate).find(c=>Math.abs(daysBetween(c,t.nextDate))<=3);if(near)first=near}
  const out=[];let cut=card&&hasDays(card)?cutFor(card,first):null;
  for(let j=0;j<n-done;j++){
    let pd;
    if(j===0)pd=first;
    else if(cut){cut=cutFor(card,addDays(cut,1));pd=cut}
    else pd=addMonths(first,j);
    out.push({...t,pdate:pd,pamount:per,pi:done+j+1,pn:n,pcut:cut?(j===0&&t.stmtCut?t.stmtCut:cutFor(card,pd)):null});
  }
  return out;
}
let _ep=null;
const livePortions=()=>_ep||(_ep=S.tx.filter(t=>t.type==='gider').flatMap(portions));
/* kesim tarihleri: ekstreden öğrenilen gerçek tarihler (card.cuts {kesim:sonÖdeme}) aynı aydaki hesaplanan tarihin yerine geçer */
function cutCands(card,dateStr){const d=parse(dateStr);const known=card.cuts||{};const out=[];for(let i=-2;i<=2;i++){const g=dayIn(d.getFullYear(),d.getMonth()+i,card.cutDay);out.push(Object.keys(known).find(x=>x.slice(0,7)===g.slice(0,7))||g)}return out.sort()}
function cutFor(card,dateStr){return cutCands(card,dateStr).find(c=>c>=dateStr)}
function dueFor(card,cut){if(card.cuts&&card.cuts[cut])return card.cuts[cut];const d=parse(cut);return card.dueDay>card.cutDay?dayIn(d.getFullYear(),d.getMonth(),card.dueDay):dayIn(d.getFullYear(),d.getMonth()+1,card.dueDay)}
function prevCut(card,cut){const c=cutCands(card,cut).filter(x=>x<cut);return c[c.length-1]}
function lastCut(card){const t=today();const c=cutCands(card,t).filter(x=>x<=t);return c[c.length-1]}
function stmt(card,cut){
  const items=livePortions().filter(p=>p.cardId===card.id&&(p.pcut||cutFor(card,p.pdate))===cut);
  const by={};let total=0;items.forEach(p=>{by[p.personId]=(by[p.personId]||0)+p.pamount;total+=p.pamount});
  const rec=S.stmts.find(s=>s.cardId===card.id&&s.cut===cut);
  return {cut,due:rec?.due||dueFor(card,cut),items,by,total,paid:!!rec?.paid,checked:!!rec?.checked,bankTotal:rec?.bankTotal,rec};
}
function cardState(c){
  if(!hasDays(c)){const T=cardTotals(c);return {noDays:true,last:{total:0,by:{},paid:true,cut:today(),due:today(),items:[]},open:{total:T.spent,by:T.by,cut:'9999-12-31',due:'9999-12-31',items:T.billed},future:T.fut,futTotal:T.futT,debt:T.debt+T.futT,T}}
  const lc=lastCut(c);const last=stmt(c,lc);const open=stmt(c,cutFor(c,addDays(lc,1)));
  const future=livePortions().filter(p=>p.cardId===c.id&&(p.pcut||p.pdate)>open.cut);
  const futTotal=future.reduce((a,p)=>a+p.pamount,0);
  const T=cardTotals(c);
  return {last,open,future,futTotal:T.futT,debt:T.debt+T.futT,T};
}
/* kartın toplam borcu: kesim tarihinden bağımsız, girilen tüm harcamalar (bu döneme kadar düşen taksitler dahil) − karta yapılan ödemeler */
function cardTotals(c){
  const open=hasDays(c)?cutFor(c,today()):'9999-12-31';
  const ps=livePortions().filter(p=>p.cardId===c.id);
  const billed=ps.filter(p=>(p.pcut||p.pdate)<=open),fut=ps.filter(p=>(p.pcut||p.pdate)>open);
  const by={};billed.forEach(p=>by[p.personId]=(by[p.personId]||0)+p.pamount);
  const spent=billed.reduce((a,p)=>a+p.pamount,0);
  const pays=S.tx.filter(t=>t.type==='transfer'&&t.toCardId===c.id);const paid=pays.reduce((a,t)=>a+t.amount,0);
  return {spent,paid,debt:spent-paid,futT:fut.reduce((a,p)=>a+p.pamount,0),by,billed,fut,pays,open};
}
/* kartta benim borcum: ödemeler kişilerin paylarına oranla dağıtılır; henüz düşmemiş taksitler ayrı */
function myCard(c,st){const T=st.T;const bm=T.by[ME]||0;const debt=Math.max(0,T.debt);const now=T.spent>0.5?debt*Math.max(0,bm)/T.spent:0;const fut=T.fut.filter(p=>p.personId===ME).reduce((a,p)=>a+p.pamount,0);return {now,fut,others:debt-now}}
/* ortak limit: limitOf ile bağlı kartlar ana kartın limitini paylaşır */
const limitRoot=c=>c.limitOf&&cardById(c.limitOf)?cardById(c.limitOf):c;
function limitInfo(c){const root=limitRoot(c);const group=S.cards.filter(x=>x.id===root.id||x.limitOf===root.id);const debt=group.reduce((a,x)=>a+(cardState(x)?.debt||0),0);return {limit:root.limit||0,debt,avail:(root.limit||0)-debt,group,root,shared:group.length>1}}
function cardInstallments(c){
  const st=cardState(c);const after=st?st.last.cut:today();
  return S.tx.filter(t=>t.type==='gider'&&t.cardId===c.id&&(t.inst||1)>1).map(t=>{
    const ps=portions(t).filter(p=>(p.pcut||p.pdate)>after);
    return ps.length?{t,left:ps.length,n:ps[0].pn,per:ps[0].pamount,leftTotal:ps.reduce((a,p)=>a+p.pamount,0),next:ps[0].pdate,personId:t.personId}:null;
  }).filter(Boolean).sort((a,b)=>b.leftTotal-a.leftTotal);
}
function accBalance(a){
  const at=a.balanceAt||0;let b=num(a.balance);
  S.tx.forEach(t=>{
    if((t.ts||0)<=at)return;const amt=t.amount||0;
    if(t.account===a.name&&!t.cardId){if(t.type==='gelir'||t.type==='tahsilat')b+=amt;else if(t.type==='gider'||t.type==='verdim'||t.type==='transfer'||t.type==='odeme')b-=amt}
    if(t.type==='transfer'&&t.toAccount===a.name&&!t.toCardId)b+=amt;
  });
  return b;
}
function personLedger(pid,upto){
  const p=S.persons.find(x=>x.id===pid)||{};const since=p.since||'0000-00-00';const t=upto&&upto>today()?upto:today();
  const items=[];
  livePortions().filter(x=>x.personId===pid&&x.pdate<=t).forEach(x=>items.push({date:x.pdate,amt:x.pamount,label:(x.merchant||'Harcama')+(x.pn>1?` (${x.pi}/${x.pn})`:''),kind:'kart',src:srcLabel(x),id:x.id}));
  S.tx.filter(x=>x.personId===pid&&(x.type==='verdim'||x.type==='tahsilat')).forEach(x=>items.push({date:x.date,amt:x.type==='verdim'?x.amount:-x.amount,label:x.type==='verdim'?(x.merchant||'Verdim'):'Ödeme aldım',kind:x.type,src:srcLabel(x),id:x.id}));
  items.sort((a,b)=>b.date.localeCompare(a.date));
  const bal=(p.opening||0)+items.filter(i=>i.date>=since).reduce((a,i)=>a+i.amt,0);
  return {items,bal,since,opening:p.opening||0};
}
const debtLeft=d=>Math.max(0,(d.amount||0)-(d.payments||[]).reduce((a,p)=>a+(p.amount||0),0));
function planStatus(pl){
  const inc=S.tx.filter(x=>x.type==='gelir'&&x.planId===pl.id);const got=(pl.already||0)+inc.reduce((a,x)=>a+x.amount,0);
  const t=today();const d=parse(t);const gotThisMonth=inc.filter(x=>x.date.slice(0,7)===t.slice(0,7)).reduce((a,x)=>a+x.amount,0);
  const remaining=Math.max(0,(pl.total||0)-got);
  let next=null;if(remaining>0)next=gotThisMonth>=(pl.installment||0)?dayIn(d.getFullYear(),d.getMonth()+1,pl.day||1):dayIn(d.getFullYear(),d.getMonth(),pl.day||1);
  return {got,remaining,next};
}
function flows(T){
  const t=today();const ins=[],outs=[];
  S.cards.filter(hasDays).forEach(c=>{
    const st=cardState(c);
    [st.last,st.open].forEach(s=>{
      if(s.paid||s.total<=0.5||s.due>T)return;const est=s.cut>=t;
      outs.push({date:s.due,title:`${c.name} ödemesi`,sub:est?`Dönem açık, ${fmtD(s.cut)}'de kesilecek`:`Ekstre ${fmtD(s.cut)}`,amount:s.total,mine:s.by[ME]||0,ref:{t:'card',id:c.id},late:s.due<t});
      Object.entries(s.by).forEach(([pid,amt])=>{if(pid===ME||amt<=0.5)return;const v=Math.min(amt,Math.max(0,personLedger(pid,s.cut).bal));if(v<=0.5)return;
        ins.push({date:s.due,title:personName(pid),sub:`${c.name} ${holderCard(pid)?.id===c.id?'ek kart':'payı'}${est?' · dönem açık':''}`,amount:v,ref:{t:'person',id:pid},late:s.due<t})});
    });
  });
  S.plans.forEach(pl=>{const s=planStatus(pl);if(!s.next)return;let d=s.next,left=s.remaining;while(d<=T&&left>0.5){const v=Math.min(pl.installment||left,left);ins.push({date:d,title:pl.who||pl.name,sub:pl.name+' taksiti',amount:v,ref:{t:'plan',id:pl.id},late:d<t});left-=v;d=addMonths(d,1)}});
  S.debts.filter(d=>!d.paid&&debtLeft(d)>0&&d.dueDate&&d.dueDate<=T).forEach(d=>(d.dir==='alacak'?ins:outs).push({date:d.dueDate,title:d.who,sub:d.note||(d.dir==='alacak'?'Alacak':'Borç'),amount:debtLeft(d),ref:{t:'debt',id:d.id},late:d.dueDate<t}));
  S.recs.forEach(r=>{let d=dayIn(parse(t).getFullYear(),parse(t).getMonth(),r.day||1);if(d<=t)d=addMonths(d,1);while(d<=T){(r.dir==='gelir'?ins:outs).push({date:d,title:r.name,sub:'Düzenli '+(r.dir==='gelir'?'gelir':'gider'),amount:r.amount,ref:{t:'rec',id:r.id}});d=addMonths(d,1)}});

const IDB_NAME='kasaDefteri',IDB_STORE='docs';let idb=null;const MEM=new Map();const LIS=new Set(),PLIS=new Set();
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbAll(){return new Promise((res,rej)=>{const out=[];const req=idb.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).openCursor();req.onsuccess=()=>{const c=req.result;if(c){out.push([c.key,c.value]);c.continue()}else res(out)};req.onerror=()=>rej(req.error)})}
function idbWrite(ops){return new Promise((res,rej)=>{const tx=idb.transaction(IDB_STORE,'readwrite');const st=tx.objectStore(IDB_STORE);ops.forEach(([k,v])=>v===undefined?st.delete(k):st.put(v,k));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
const snapDocs=()=>[...MEM.entries()].filter(([k])=>k!=='market/prices').map(([id,v])=>({id,data:()=>v}));
let notifyT;function notify(){clearTimeout(notifyT);notifyT=setTimeout(()=>{const docs=snapDocs();LIS.forEach(f=>f({docs}));const p=MEM.get('market/prices');PLIS.forEach(f=>f({exists:!!p,data:()=>p}))},0)}
async function memSet(k,v){if(v===undefined)MEM.delete(k);else MEM.set(k,JSON.parse(JSON.stringify(v)));notify();await idbWrite([[k,v===undefined?undefined:MEM.get(k)]])}
const localDb={collection(){return {doc:id=>({set:v=>memSet(id,v),delete:()=>memSet(id,undefined)}),onSnapshot(f){LIS.add(f);f({docs:snapDocs()});return ()=>LIS.delete(f)}}},
  doc(path){return {set:v=>memSet(path,v),onSnapshot(f){PLIS.add(f);const p=MEM.get(path);f({exists:!!p,data:()=>p});return ()=>PLIS.delete(f)}}}};
async function replaceAll(entries){const old=[...MEM.keys()];MEM.clear();entries.forEach(([k,v])=>MEM.set(k,v));await idbWrite([...old.map(k=>[k,undefined]),...entries]);notify()}

const getKey=()=>ls.get('kd_apikey','');
const MODEL=()=>ls.get('kd_model','claude-haiku-5-5');
async function loadImg(file){const url=URL.createObjectURL(file);try{return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej({code:'image_rejected',message:'Görüntü açılamadı'});i.src=url})}finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}}
/* uzun ekran görüntülerini üst üste binen parçalara böler, her parçayı okunaklı boyutta gönderir */
async function fileToParts(file){
  const img=await loadImg(file);const W=img.naturalWidth,H=img.naturalHeight;const parts=[];
  const segH=Math.round(W*1.5),step=Math.round(segH*0.88);
  const ys=H>segH*1.15?(()=>{const a=[];for(let y=0;y<H;y+=step){a.push(Math.min(y,Math.max(0,H-segH)));if(y+segH>=H)break}return [...new Set(a)]})():[0];
  for(const y of ys){const h=ys.length>1?Math.min(segH,H-y):H;const sc=Math.min(1,1568/Math.max(W,h));const c=document.createElement('canvas');c.width=Math.round(W*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(img,0,y,W,h,0,0,c.width,c.height);parts.push(c.toDataURL('image/jpeg',0.86).split(',')[1])}
  return parts;
}
function tryParse(t){try{return {ok:true,v:JSON.parse(t)}}catch(e){return {ok:false}}}
function parseJSON(t){
  t=String(t||'').trim();const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m)t=m[1].trim();
  let r=tryParse(t);if(r.ok)return r.v;
  const st=[t.indexOf('['),t.indexOf('{')].filter(i=>i>=0);const s0=st.length?Math.min(...st):-1;const e0=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));
  let c=s0>=0&&e0>s0?t.slice(s0,e0+1):t;
  r=tryParse(c);if(r.ok)return r.v;
  c=c.replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/\/\/[^\n]*/g,'').replace(/,\s*([\]}])/g,'$1')
     .replace(/:\s*(-?\d{1,3}(?:\.\d{3})+,\d+)/g,(x,n)=>':'+n.replace(/\./g,'').replace(',','.'))
     .replace(/:\s*(-?\d+),(\d{1,2})(?=\s*[,}\]])/g,':$1.$2');
  r=tryParse(c);if(r.ok)return r.v;
  throw {code:'invalid_json',message:'Cevap okunamadı',raw:t};
}
async function apiCall(prompt,files,maxTokens,offset){
  const key=getKey();if(!key)throw {code:'no_key',message:'API anahtarı yok'};
  const content=[];let n=0;let fi=0;for(const f of files||[]){fi++;if((files||[]).length>1||offset)content.push({type:'text',text:`Görüntü ${fi+(offset||0)}:`});
    if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)){const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej({code:'image_rejected',message:'PDF okunamadı'});r.readAsDataURL(f)});content.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}});n+=2;continue}
    const ps=await fileToParts(f);ps.forEach(b=>{content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:b}});n++})}
  if(n>1)prompt+='\nNot: Görüntüler sırayla verilen, üst üste binen parçalardır; aynı satırı iki kez yazma.';
  content.push({type:'text',text:prompt});
  let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:MODEL(),max_tokens:maxTokens||8192,messages:[{role:'user',content}]})})}catch(e){throw {code:'network',message:'İnternet bağlantısı yok gibi görünüyor'}}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const msg=j?.error?.message||('HTTP '+r.status);throw {code:r.status===401?'bad_key':r.status===429?'rate_limited':/credit|balance|billing/i.test(msg)?'no_credit':'api',message:msg}}
  const txt=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
  try{const u=j.usage||{};const pr=/sonnet/.test(MODEL())?[2,10]:[0.10,0.50];const cost=(u.input_tokens||0)*pr[0]/1e6+(u.output_tokens||0)*pr[1]/1e6;ls.set('kd_cost',String(num(ls.get('kd_cost','0'))+cost));ls.set('kd_calls',String(num(ls.get('kd_calls','0'))+1))}catch(e){}
  ls.set('kd_lastraw',txt.slice(0,20000));
  return txt;
}
const JSON_RULE='\nYalnızca istenen JSON\'u döndür; başına ya da sonuna açıklama yazma, kod bloğu kullanma. Tutar alanlarını ekranda ya da fişte göründüğü gibi metin olarak yaz (ör. "2.487,50"); kendin dönüştürme. Adet ve taksit gibi diğer sayıları düz sayı yaz.';
const apiSample={json:async(prompt,opts)=>{

}};

const qs={};
function serial(key,fn){const p=(qs[key]||Promise.resolve()).catch(()=>{}).then(fn);qs[key]=p;return p}
function clean(o){const r={};Object.entries(o).forEach(([k,v])=>{if(v!==undefined&&v!==null&&!(typeof v==='number'&&!isFinite(v)))r[k]=v});return r}

  list.forEach(t=>{const {id,...rest}=t;const mid='m-'+t.date.slice(0,7);(S.months[mid]=S.months[mid]||{})[id]=clean(rest);touched.add(mid)});

function partition(docs){
  const arr={card:'cards',account:'accounts',person:'persons',budget:'budgets',asset:'assets',debt:'debts',plan:'plans',stmt:'stmts',cat:'cats',rec:'recs'};
  Object.values(arr).forEach(k=>S[k]=[]);S.months={};S.amonths={};S.rmonths={};
  docs.forEach(d=>{const v=d.data();if(!v)return;
    if(v.k==='month')S.months[d.id]=v.items||{};
    else if(v.k==='amonth')S.amonths[d.id]=v.items||{};
    else if(v.k==='rmonth')S.rmonths[d.id]=v.items||{};
    else if(v.k==='merchants')S.merch=v.map||{};
    else if(v.k==='products')S.prod={map:v.map||{},alias:v.alias||{}};
    else if(v.k==='meta')S.meta=v;
    else if(v.k==='cattree')S.catTree=v.tree;
    else if(arr[v.k])S[arr[v.k]].push({...v,id:d.id});
  });
  derive();
  ['cards','accounts','persons'].forEach(k=>S[k].sort((a,b)=>(a.order??1e9)-(b.order??1e9)||(a.ts||0)-(b.ts||0)));
  document.getElementById('prodNames').innerHTML=Object.values(S.prod.map).map(p=>`<option value="${esc(p.name)}">`).join('');
}

  const first=lines.length?lines.reduce((a,l)=>l.cut<a?l.cut:a,'9999'):null;

function trendSvg(endK){
  const ks=[5,4,3,2,1,0].map(i=>shiftMonth(endK,-i));const vals=ks.map(k=>({inc:incomeTotal(k),mine:mineTotal(k)}));
  const max=Math.max(1,...vals.flatMap(v=>[v.inc,v.mine]));const W=320,H=130,top=8,bot=22,bw=16,gap=W/6;const y=v=>top+(H-top-bot)*(1-Math.max(0,v)/max);
  let s=`<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Son 6 ay gelir ve harcama"><line x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}" stroke="var(--line)"/>`;
  ks.forEach((k,i)=>{const cx=gap*i+gap/2,v=vals[i];
    s+=`<rect x="${cx-bw-1}" y="${y(v.inc)}" width="${bw}" height="${H-bot-y(v.inc)}" rx="3" fill="var(--inc)"><title>Gelir ${TL(v.inc)}</title></rect><rect x="${cx+1}" y="${y(v.mine)}" width="${bw}" height="${H-bot-y(v.mine)}" rx="3" fill="${k===endK?'var(--accent)':'var(--muted)'}"><title>Harcama ${TL(v.mine)}</title></rect><text x="${cx}" y="${H-6}" text-anchor="middle" ${k===endK?'style="fill:var(--ink);font-weight:700"':''}>${AYK[+k.slice(5)-1]}</text>`});
  return s+`</svg><div class="legend"><span><i style="background:var(--inc)"></i>Gelir</span><span><i style="background:var(--accent)"></i>Benim harcamam</span><span class="sp"></span><span>en yüksek ${TL(max)}</span></div>`;
}

function txRow(x){

    if(share>0&&r.splitP!==r.personId){const gid=newId();return [clean({...base,id:newId(),groupId:gid,amount:sign*r2(r.amount-share),personId:r.personId,category:mine?c.category:'',sub:mine?c.sub:''}),clean({...base,id:newId(),groupId:gid,amount:sign*r2(share),personId:r.splitP,category:'',sub:''})].filter(t=>Math.abs(t.amount)>0.004)}
    return [clean({...base,id:newId(),amount:sign*r.amount,category:mine?c.category:'',sub:mine?c.sub:'',personId:r.personId})];
  });
  const info=RV;
  try{
    if(list.length)await saveTx(list);if(learned)await saveMerch();
    if(info.mode==='stmt'){const card=info.card;const upd={...card};let ch=false;
      if(info.limit&&!card.limit){upd.limit=info.limit;ch=true}
      const cuts={...(card.cuts||{})};if(info.end&&info.due){cuts[info.end]=info.due;ch=true}if(info.nextCut&&info.nextDue){cuts[info.nextCut]=info.nextDue;ch=true}upd.cuts=cuts;
      if(info.nextCut&&info.nextDue){upd.cutDay=parse(info.nextCut).getDate();upd.dueDay=parse(info.nextDue).getDate();ch=true}
      else if(!hasDays(card)&&info.due){upd.cutDay=parse(info.end).getDate();upd.dueDay=parse(info.due).getDate();ch=true}
      if(ch)await put(upd);
      /* ekstrede eşleşen tek çekimlik harcamalar bu ekstreye sabitlenir; kesim tarihi tatil yüzünden kaysa da yeni döneme karışmaz */
      const pinIds=new Set();info.matched.forEach(({c})=>{if(c.pn!==1)return;if(c.groupId)S.tx.filter(t=>t.groupId===c.groupId).forEach(t=>pinIds.add(t.id));else pinIds.add(c.id)});
      const pins=S.tx.filter(t=>pinIds.has(t.id)&&t.stmtCut!==info.end).map(t=>({...t,stmtCut:info.end}));if(pins.length)await saveTx(pins);
      const cutKey=hasDays(upd)?cutFor(upd,info.end):info.end;
      const ex=S.stmts.find(s=>s.cardId===card.id&&s.cut===cutKey);
      await put({...(ex||{}),id:ex?.id,k:'stmt',cardId:card.id,cut:cutKey,due:info.due||undefined,checked:true,bankTotal:info.bankTotal??undefined,paid:!!ex?.paid});
    }
    const cats=[...new Set(list.filter(t=>t.type==='gider'&&t.personId===ME).map(t=>t.category))];
    RV=null;closeSheet();setTimeout(()=>budgetAlert(cats,`${list.length} kayıt eklendi`),300);
  }catch(e){toast('Kaydedilemedi: '+(e?.message||'hata'))}
}
function budgetAlert(cats,prefix){const bu=budgetUse(today().slice(0,7)).filter(b=>cats.includes(b.category)&&b.pct>=80);if(!bu.length){if(prefix)toast(prefix);return}const b=bu[0];toast(b.pct>=100?`⚠ ${b.category} bütçeni aştın: ${TL(b.spent)} / ${TL(b.limit)}`:`${b.category} bütçenin %${Math.round(b.pct)}'i doldu`,6000)}

async function runFis(){

Yalnızca şu JSON'u döndür: {"store":"kısa marka adı","date":"YYYY-MM-DD","total":"fiş TOPLAMI, ekranda yazdığı gibi metin","items":[{"raw":"fişteki ad aynen","name":"genel ürün adı, marka ve gramajsız (Muz, Peçete, Süt)","brand":"","size":"paket gramajı/hacmi, tartılıda boş","qty":sayı,"unit":"adet|kg","unitPrice":"birim ya da kg fiyatı, fişte yazdığı gibi metin","lineTotal":"satır tutarı, fişte yazdığı gibi metin","discount":"ürüne indirim, metin; yoksa 0","group":"${PGROUPS.join(' | ')}"}]}
Kurallar: "2 x 12,50" ya da üst/alt satırdaki "2 AD X 12,50": qty 2, unitPrice 12,50, lineTotal 25,00; çarpanı doğru ürüne bağla, tek ürün sanma. Tartılı "0,845 KG X 89,90": qty 0.845, unit kg, unitPrice 89,90. İndirim satırlarını ayrı ürün yazma, üstündeki ürünün discount'una ekle. KDV, ara toplam, ödeme satırlarını yazma. Virgül ondalıktır.${known?` Bilinen ürün adları (aynı ürünse bunları kullan): ${known}.`:''}`;
  try{const res=(await askImages(prompt,files.slice(0,sampleCaps?.images?.maxCount||4)))[0]||{};

function tidyStore(s){s=String(s||'Market').trim();const k=asciiUp(s).replace(/\s/g,'');const map={MIGROS:'Migros',FILE:'File',A101:'A101',BIM:'BİM',SOK:'Şok',CARREFOURSA:'CarrefourSA',MACROFOOD:'Macrofood',METRO:'Metro',HAKMAR:'Hakmar',TARIMKREDI:'Tarım Kredi'};for(const[a,b]of Object.entries(map))if(k.startsWith(a))return b;return s.slice(0,24)}
function findProd(name,size){const k=normProd(name)+'|'+normSize(size);return Object.keys(S.prod.map).find(pid=>{const p=S.prod.map[pid];return normProd(p.name)+'|'+normSize(p.size||'')===k})||null}
function fisItem(it){
  const qty=Math.abs(trAmount(it.qty))||1;let up=Math.abs(trAmount(it.unitPrice)),lt=trAmount(it.lineTotal);const unit=String(it.unit||'').toLowerCase().startsWith('k')?'kg':'adet';let warn='';
  if(!lt&&up)lt=r2(qty*up);if(!up&&lt)up=r2(lt/qty);if(Math.abs(qty*up-lt)>0.06&&lt>0){up=r2(lt/qty);warn='Adet × fiyat satır tutarını tutmuyordu, birim fiyatı satırdan hesapladım.'}
  const name=String(it.name||it.raw||'Ürün').trim(),size=String(it.size||'').trim();const al=S.prod.alias[normProd(it.raw)];const ex=al&&S.prod.map[al]?al:findProd(name,size);
  return {raw:String(it.raw||name),name:ex?S.prod.map[ex].name:name,size:ex?(S.prod.map[ex].size||''):size,brand:String(it.brand||''),qty,unit,unitPrice:up,lineTotal:r2(lt),discount:r2(Math.abs(trAmount(it.discount))),group:PGROUPS.includes(it.group)?it.group:(ex?S.prod.map[ex].group:'Diğer'),warn,on:true};
}

async function backup(kind){

  const d=today();let filename,data;
  if(kind==='csv'){
    const q=v=>{const t=String(v??'');return /[;"\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
    const typeName={gider:'Harcama',gelir:'Gelir',tahsilat:'Ödeme aldım',verdim:'Verdim',transfer:'Transfer',duzeltme:'Düzeltme',odeme:'Planlı ödeme'};
    const row=(t,src)=>[t.date,typeName[t.type]||t.type,nf2.format(t.amount||0),t.merchant||'',t.category||'',t.sub||'',t.source||'',personName(t.personId||ME),srcLabel(t),t.toCardId?(cardById(t.toCardId)?.name||''):(t.toAccount||''),(t.inst||1)>1?t.inst:'',t.note||'',src].map(q).join(';');
    data='\ufeff'+['Tarih;Tür;Tutar;Açıklama;Kategori;Alt kategori;Gelir türü;Kişi;Kart/Hesap;Nereye;Taksit;Not;Kaynak',...S.tx.map(t=>row(t,'Kasa Defteri')),...S.arch.map(t=>row(t,'Money Pro arşivi'))].join('\r\n');
    filename=`kasa-defteri-${d}.csv`;
  }else{
    data=JSON.stringify({exportedAt:new Date().toISOString(),months:S.months,archive:S.amonths,receipts:S.rmonths,cards:S.cards,accounts:S.accounts,persons:S.persons,budgets:S.budgets,assets:S.assets,debts:S.debts,plans:S.plans,stmts:S.stmts,cats:S.cats,recs:S.recs,merchants:S.merch,products:S.prod,prices:S.prices,meta:S.meta},null,1);
    filename=`kasa-defteri-yedek-${d}.json`;
  }
  try{const blob=new Blob([data],{type:kind==='csv'?'text/csv':'application/json'});const file=new File([blob],filename,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:filename});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
    await put({...S.meta,id:'meta',k:'meta',lastBackup:d});toast('Yedek hazır. "Dosyalara Kaydet" ile sakla.')}
  catch(e){toast(e?.name==='AbortError'?'Yedek iptal edildi':'Yedek alınamadı: '+(e?.message||'hata'))}
}
async function restoreFrom(file){
  let j;try{j=JSON.parse(await file.text())}catch(e){toast('Bu dosya okunamadı. Kasa Defteri yedeği (.json) seç.');return}
  if(!j||(!j.months&&!j.archive&&!j.cards)){toast('Bu dosya bir Kasa Defteri yedeği değil.');return}
  const E=[];const add=(k,v)=>E.push([k,v]);
  Object.entries(j.months||{}).forEach(([id,items])=>add(id,{k:'month',items}));
  Object.entries(j.archive||{}).forEach(([id,items])=>add(id,{k:'amonth',items}));
  Object.entries(j.receipts||{}).forEach(([id,items])=>add(id,{k:'rmonth',items}));
  const kinds={cards:'card',accounts:'account',persons:'person',budgets:'budget',assets:'asset',debts:'debt',plans:'plan',stmts:'stmt',cats:'cat',recs:'rec'};
  Object.entries(kinds).forEach(([arr,k])=>(j[arr]||[]).forEach(({id,...rest})=>add(id,{...rest,k})));
  if(j.merchants)add('merchants',{k:'merchants',map:j.merchants});
  if(j.products)add('products',{k:'products',map:j.products.map||{},alias:j.products.alias||{}});
  if(j.meta)add('meta',{...j.meta,k:'meta'});
  if(j.prices&&Object.keys(j.prices).length)add('market/prices',j.prices);
  await replaceAll(E);closeSheet();goTab('ana');toast(`Yedek yüklendi · ${E.length} kayıt grubu`);
}
async function copyStatement(pid,cardId,cut){
  let items;
  if(cardId&&cut){const c=cardById(cardId);items=stmt(c,cut).items.filter(p=>p.personId===pid).map(p=>({date:p.pdate,label:p.merchant+(p.pn>1?` (${p.pi}/${p.pn})`:''),amt:p.pamount,src:c.name}))}
  else{const L=personLedger(pid);const lastPay=L.items.filter(i=>i.kind==='tahsilat').map(i=>i.date).sort().pop()||'';items=L.items.filter(i=>i.amt>0&&i.date>lastPay&&i.date>=L.since)}
  items.sort((a,b)=>a.date.localeCompare(b.date));const tot=items.reduce((a,i)=>a+i.amt,0);
  const txt=`${personName(pid)} – kart harcamaları\n`+items.map(i=>`${fmtD(i.date)}  ${i.label}  ${TL2(i.amt)}${i.src?'  ['+i.src+']':''}`).join('\n')+`\n\nToplam: ${TL2(tot)}`;
  try{await navigator.clipboard.writeText(txt);toast('Döküm kopyalandı')}catch(e){openSheet(head('Döküm')+`<textarea id="copyTxt" class="inp" style="height:300px">${esc(txt)}</textarea>`);document.getElementById('copyTxt').select()}
}
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;const fd=new FormData(f);const g=k=>fd.get(k);
  try{switch(f.dataset.form){
    case 'tx':{const type=g('type');const amount=Math.abs(num(g('amount')));if(amount<=0){toast('Tutar gir');return}
      const old=S.tx.find(x=>x.id===g('id'));const o={...(old||{}),id:g('id')||newId(),type,amount,date:g('date'),note:g('note')||'',...srcParse(g('src')),ts:old?.ts||Date.now(),via:old?.via||'manuel'};
      if(type==='gider'){const pid=g('personId');const c=pid===ME?(parseCat(g('cat'))||{category:'Diğer',sub:''}):{category:'',sub:''};Object.assign(o,{merchant:g('merchant'),category:c.category,sub:c.sub,personId:pid,inst:Math.max(1,Math.round(num(g('inst'))||1))});
        const n=o.inst,no=Math.min(n,Math.max(1,Math.round(num(g('instNo'))||1)));o.amount=amount*n;
        if(n>1&&no>1){if(!(old&&old.nextDate&&old.instDone===no-1&&old.cardId===o.cardId)){const cd=cardById(o.cardId);let nd=o.date;if(cd&&hasDays(cd)){const lc=lastCut(cd);if(nd<=lc)nd=cutFor(cd,addDays(lc,1))}o.nextDate=nd}o.instDone=no-1}else{delete o.nextDate;delete o.instDone}

      await saveTx([o,...extra]);closeSheet();if(type==='gider'&&o.personId===ME)setTimeout(()=>budgetAlert([o.category],'Kaydedildi'),300);else toast('Kaydedildi');break}
    case 'card':{const cut=Math.round(num(g('cutDay'))),due=Math.round(num(g('dueDay')));if(cut<1||cut>31||due<1||due>31){toast('Günler 1-31 arası olmalı');return}const ex=cardById(g('id'));
      await put({...(ex||{}),id:g('id')||undefined,k:'card',name:g('name').trim(),limit:g('limitOf')?0:(num(g('limit'))||0),limitOf:g('limitOf')||'',cutDay:cut,dueDay:due,holderId:g('holderId')||'',ts:ex?.ts||Date.now()});closeSheet();toast('Kart kaydedildi');break}
    case 'paycard':{const c=cardById(g('cardId'));const amt=num(g('amount'));if(amt<=0)return;const d=g('date')||today();await saveTx([{id:newId(),type:'transfer',amount:amt,date:d,account:g('account')||'',toCardId:c.id,merchant:`${c.name} borç ödemesi`,ts:Date.now(),via:'manuel'}]);
      const st=cardState(c);if(st&&!st.noDays&&!st.last.paid&&st.last.total>0.5&&amt>=st.last.total-1){const ex=S.stmts.find(x=>x.cardId===c.id&&x.cut===st.last.cut);await put({...(ex||{}),id:ex?.id,k:'stmt',cardId:c.id,cut:st.last.cut,paid:true})}
      closeSheet();toast('Ödeme kaydedildi');break}
    case 'crange':{cardRange[g('id')]={from:g('from')||'',to:g('to')||''};const c=cardById(g('id'));openSheet(head(esc(c.name))+cardBlock(c,cardState(c)));break}
    case 'paystmt':{const c=cardById(g('cardId'));const cut=g('cut');const amt=num(g('amount'));
      if(amt>0)await saveTx([{id:newId(),type:'transfer',amount:amt,date:today(),account:g('account')||'',toCardId:c.id,merchant:`${c.name} ekstre ödemesi`,ts:Date.now(),via:'manuel'}]);
      const ex=S.stmts.find(s=>s.cardId===c.id&&s.cut===cut);await put({...(ex||{}),id:ex?.id,k:'stmt',cardId:c.id,cut,paid:true});closeSheet();toast('Ekstre ödendi');break}

    case 'accren':{const a=S.accounts.find(x=>x.id===g('id'));const nn=String(g('name')).trim();if(!nn||nn===a.name)return;const old=a.name;const list=S.tx.filter(t=>t.account===old||t.toAccount===old).map(t=>({...t,account:t.account===old?nn:t.account,toAccount:t.toAccount===old?nn:t.toAccount}));await put({...a,name:nn});if(list.length)await saveTx(list);closeSheet();toast('Hesap adı değişti');break}
