<style>
/* Layout: tek sütun mobil uygulama — Ana Sayfa tek bakışta özet; her satıra dokununca alttan detay açılır; altta 5 sekme: Ana Sayfa, Kartlar, Analiz, Hareketler, Fişler */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --ink:#15211C; --muted:#5A6A62; --line:#D5DDD8; --chip:#E2EAE5;
  --accent:#0D6A4D; --accent-ink:#FFFFFF; --accent-soft:#D5EBE1;
  --gold:#9C7019; --ok:#2B7A4B; --warn:#B0731B; --crit:#BE3A2C; --plus:#1F7A4A; --inc:#6E9E86; --other:#7A6AA8; --c1:#0D6A4D; --c2:#C2843A; --c3:#4A6FA5; --c4:#B4535D; --c5:#3E9C9C; --c6:#8E7CC3; --c7:#8C8C3A; --c8:#9E6B4F;
  --vup:#e34948; --vdown:#2a78d6; --v0:#A9B3AE; --v1:#2a78d6; --v2:#eb6834; --v3:#1baf7a; --v4:#eda100; --v5:#e87ba4; --v6:#008300;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#17211D; --ink:#E5EDE8; --muted:#90A298; --line:#293630; --chip:#202D27;
  --accent:#43B98E; --accent-ink:#04120C; --accent-soft:#1B3A2E;
  --gold:#D8AC52; --ok:#52C17F; --warn:#E3A64B; --crit:#EE6B5B; --plus:#5BCB8B; --inc:#3C6E58; --other:#A596D6; --c1:#43B98E; --c2:#E0A456; --c3:#7A9FD6; --c4:#E07B85; --c5:#5CC4C4; --c6:#AE9EE8; --c7:#BDBD5A; --c8:#C9926F; --vup:#e66767; --vdown:#3987e5; --v0:#56645D; --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#c98500; --v5:#d55181; --v6:#008300; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#17211D; --ink:#E5EDE8; --muted:#90A298; --line:#293630; --chip:#202D27;
  --accent:#43B98E; --accent-ink:#04120C; --accent-soft:#1B3A2E;
  --gold:#D8AC52; --ok:#52C17F; --warn:#E3A64B; --crit:#EE6B5B; --plus:#5BCB8B; --inc:#3C6E58; --other:#A596D6; --c1:#43B98E; --c2:#E0A456; --c3:#7A9FD6; --c4:#E07B85; --c5:#5CC4C4; --c6:#AE9EE8; --c7:#BDBD5A; --c8:#C9926F; --vup:#e66767; --vdown:#3987e5; --v0:#56645D; --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#c98500; --v5:#d55181; --v6:#008300; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;flex:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink)}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.sec h2{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec h2 .sum{font-family:var(--f-body);font-size:16px;font-weight:700}
.sp{flex:1}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.monthbar{display:flex;align-items:center;gap:8px}
.monthbar .m{flex:1;text-align:center;font-family:var(--f-display);font-weight:600;font-size:17px}
.monthbar button{border:0;background:var(--chip);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.hero .lbl{font-size:12.5px;opacity:.85}
.hero .big{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.hero .proj{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--accent-ink) 12%,transparent);border-radius:12px;padding:10px 12px}
.hero .proj .v{font-family:var(--f-display);font-size:22px;font-weight:700}
.hero input[type=date]{background:transparent;border:1px solid color-mix(in srgb,var(--accent-ink) 40%,transparent);color:var(--accent-ink);border-radius:8px;padding:3px 6px;font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding-block:9px;border-top:1px solid var(--line)}
.row:first-child,.daygrp+.row,h2+.row,.small+.row{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap;text-align:right}
.amt.plus{color:var(--plus)}
.amt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.amt .mine{font-family:var(--f-display);font-size:21px;font-weight:700;color:var(--ink)}
.tap{cursor:pointer}
.chev{color:var(--muted);font-size:18px;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--ink);white-space:nowrap}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.crit{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.oth{background:color-mix(in srgb,var(--other) 18%,transparent);color:var(--other)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.crit{background:var(--crit)} .bar i.fut{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding-block:6px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;font-size:14px}
.kv .k{color:var(--muted)}
.kv b{text-align:right}
.box{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.box .tot{font-family:var(--f-display);font-size:22px;font-weight:700}
.split{display:flex;flex-direction:column}
.split .row{padding-block:6px}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink);display:flex;gap:10px;align-items:center}
.steps{display:flex;flex-direction:column;gap:6px}
.steps button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:14px}
.steps button.done{opacity:.55}
.steps button .n{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.steps button.done .n{background:var(--ok);color:var(--accent-ink)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;min-width:0}
.nav button svg{width:22px;height:22px;stroke:currentColor}
.nav button.on{color:var(--accent)}
.fab{position:fixed;z-index:26;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--ink);color:var(--bg);font-size:28px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .bg{position:absolute;inset:0;background:rgba(5,12,9,.5)}
.sheet .card{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{font-family:var(--f-display);font-size:19px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.x{border:0;background:var(--chip);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px;flex:none}
form{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;font-size:16px;color:var(--ink);font-weight:500;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*,.three>*{min-width:0}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;text-align:center;padding:8px 4px;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer;border:0;background:none}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:13px;cursor:pointer}
.menu button b{display:block;font-size:15px}
.menu button span{font-size:13px;color:var(--muted)}
.menu .ic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.menu .ic svg{width:20px;height:20px;stroke:var(--accent)}
.rv{border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:8px}
.rv.new{border-color:var(--warn)} .rv.bad{border-color:var(--crit)} .rv.off{opacity:.55} .rv.oth{border-color:var(--other)}
.rv .h{display:flex;gap:8px;align-items:center}
.rv .h .main{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv select,.rv input[type=number],.rv input[type=date],.rv input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px;font-size:15px;width:100%;min-width:0;color:var(--ink)}
.rv .cb{width:20px;height:20px;accent-color:var(--accent);flex:none}
.mini{font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.ask{font-size:13px;font-weight:600;color:var(--warn)}
.bad-t{font-size:13px;font-weight:600;color:var(--crit)}

/* ===== Analiz sekmesi ===== */
.vhero .vbig{font-family:var(--f-display);font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:4px 0 6px}
.vsub{font-size:14px;color:var(--muted);line-height:1.6}.vsub b{color:var(--ink)}
.vchip{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.vchip.up{background:color-mix(in srgb,var(--crit) 13%,transparent);color:var(--crit)}.vchip.down{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.vincome{margin-top:16px}.vbar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}.vbar i{display:block;height:100%;background:var(--accent);border-radius:99px}.vbar i.over{background:var(--crit)}.vbar.thin{height:6px;margin-top:6px}
.vrow3{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:7px}.vrow3 b{color:var(--ink)}.vrow3 b.neg{color:var(--crit)}
.vins{list-style:none;margin:0;padding:0;display:grid;gap:10px}.vins li{display:flex;gap:10px;align-items:baseline;font-size:14.5px;line-height:1.4}
.vdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}.vdot.up{background:var(--vup)}.vdot.down{background:var(--vdown)}
.vdwrap{display:flex;justify-content:center;margin:2px 0 10px}.vdonut{width:190px;height:190px;overflow:visible}.vdonut path{cursor:pointer}
.vdc1{font-size:9.5px;fill:var(--muted);font-family:var(--f-body)}.vdc2{font-size:18px;font-weight:700;fill:var(--ink);font-family:var(--f-display)}
.vleg{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto 44px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.vleg i{width:12px;height:12px;border-radius:4px}.vleg .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.vleg .p{color:var(--muted);font-size:12.5px}.vleg b{font-weight:700}
.vleg .d{font-size:12px;font-weight:700;text-align:right}.d.up{color:var(--vup)}.d.down{color:var(--vdown)}
.vrest summary{list-style:none;cursor:pointer}.vrest summary::-webkit-details-marker{display:none}.vrest>.vleg{padding-left:12px;font-size:13.5px}.vrest summary .n::after{content:' ▾';color:var(--muted);font-weight:400}.vrest[open] summary .n::after{content:' ▴'}
.vpace,.vyear{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y;font-family:var(--f-body)}
.vgrid{stroke:var(--line);stroke-dasharray:2 3}.vbase{stroke:var(--line)}.vax{font-size:10px;fill:var(--muted)}.vax.on{fill:var(--ink);font-weight:700}
.vl{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.vl.cur{stroke:var(--accent);stroke-width:2.5}.vl.avg{stroke:var(--muted);stroke-dasharray:4 4}.vl.fc{stroke:var(--accent);stroke-dasharray:3 4;opacity:.75}
.vpt{stroke:var(--surface);stroke-width:2}.vpt.cur{fill:var(--accent)}.vpt.fc{fill:var(--surface);stroke:var(--accent)}
.vlab{font-size:11px;font-weight:700}.vlab.cur{fill:var(--ink)}.vlab.avg{fill:var(--muted);font-weight:600}
.vxh{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2}
.vb{fill:var(--muted);opacity:.32}.vb.sel{fill:var(--accent);opacity:1}.vavg{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.vkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}.vkey span{display:inline-flex;align-items:center;gap:6px}
.vkey i.ln{width:16px;height:0;border-top:2.5px solid var(--accent)}.vkey i.ln.avg{border-top:2px dashed var(--muted)}.vkey i.ln.fc{border-top:2px dashed var(--accent);opacity:.75}
.vkey i.sq{width:11px;height:11px;border-radius:3px;background:var(--muted);opacity:.32}.vkey i.sq.sel{background:var(--accent);opacity:1}.vkey i.sq.up{background:var(--vup);opacity:1}.vkey i.sq.down{background:var(--vdown);opacity:1}
.vkey i.sq.hatch{opacity:1;background:repeating-linear-gradient(45deg,var(--accent-soft) 0 2px,color-mix(in srgb,var(--accent) 55%,var(--accent-soft)) 2px 3.5px)}
.vdiv{display:grid}.vdr{display:grid;grid-template-columns:minmax(0,96px) 1fr 58px;gap:8px;align-items:center;padding:8px 0;font-size:13.5px}
.vdr .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.vdr .track{position:relative;height:12px}.vdr .mid{position:absolute;left:50%;top:-4px;bottom:-4px;border-left:1px solid var(--muted);opacity:.6}
.vdr i{position:absolute;top:0;height:12px;min-width:2px}.vdr i.up{background:var(--vup);border-radius:0 4px 4px 0}.vdr i.down{background:var(--vdown);border-radius:4px 0 0 4px}.vdr b{text-align:right;font-size:13px}
.vshop{padding:9px 0;border-top:1px solid var(--line)}.vshop:first-of-type{border-top:0}.vshop .vbar i{opacity:.8}
.vmore>summary{list-style:none;cursor:pointer}.vmore>summary::-webkit-details-marker{display:none}.vmore>summary h2{margin:0}.vmore>summary h2::after{content:'›';margin-left:auto;color:var(--muted);font-size:20px;line-height:1;transition:transform .2s}.vmore[open]>summary h2::after{transform:rotate(90deg)}.vmore[open]>summary{margin-bottom:10px}
.vtip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.vmini{display:flex;gap:18px;align-items:flex-end;margin-top:12px}.vmini>div{display:flex;flex-direction:column}.vmini .k{font-size:12px;color:var(--muted)}.vmini b{font-size:19px;font-family:var(--f-display)}.vmini .linkbtn{margin-left:auto}

const ASSET_TYPES={gram:'Gram altın',ceyrek:'Çeyrek altın',yarim:'Yarım altın',tam:'Tam altın',gumus:'Gram gümüş',usd:'Dolar',eur:'Euro',tl:'Türk lirası',esya:'Araç / diğer eşya'};

/* varlığın bugünkü değeri; araç/eşya için elle girilen tahmini değer */
const aVal=(a,P)=>a.type==='esya'?num(a.value):a.qty*aPrice(P,a.type);

const PGROUPS=['Meyve & sebze','Et & tavuk','Süt & kahvaltılık','Temel gıda','Atıştırmalık','İçecek','Temizlik','Kişisel bakım','Kağıt ürünleri','Bebek','Evcil hayvan','Diğer'];

/* ===================== YARDIMCILAR ===================== */
const nf0=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nfq=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:3});
const TL=n=>(n<=-0.5?'−':'')+nf0.format(Math.abs(Math.round(n||0)))+' ₺';
const TL2=n=>(n<0?'−':'')+nf2.format(Math.abs(n||0))+' ₺';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>ymd(new Date());
const dayIn=(y,m,day)=>{const t=new Date(y,m,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return ymd(new Date(t.getFullYear(),t.getMonth(),Math.min(day,last)))};
const addMonths=(s,n)=>{const d=parse(s);return dayIn(d.getFullYear(),d.getMonth()+n,d.getDate())};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmtD=s=>{const d=parse(s);return `${d.getDate()} ${AYK[d.getMonth()]}`};
const fmtDY=s=>{const d=parse(s);return `${d.getDate()} ${AY[d.getMonth()]} ${d.getFullYear()}`};
const monthLabel=k=>{const[y,m]=k.split('-').map(Number);return `${AY[m-1]} ${y}`};
const shiftMonth=(k,n)=>addMonths(k+'-01',n).slice(0,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;let s=String(v??'').trim();if(/,\d{1,3}$/.test(s)&&s.includes('.'))s=s.replace(/\./g,'');s=s.replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0};
const r2=n=>Math.round(n*100)/100;
/* ekrandaki tutarı Türkçe biçime göre çözer: "2.487,50" → 2487.5, "2.487" → 2487, "45,9" → 45.9, "1,250.00" → 1250 */
function trAmount(v){if(typeof v==='number')return isFinite(v)?v:0;let s=String(v??'').replace(/[^\d.,-]/g,'');if(!s)return 0;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>=0&&ld>=0){if(lc>ld)s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}
  else if(lc>=0){s=/^-?\d{1,3}(,\d{3})+$/.test(s)?s.replace(/,/g,''):s.replace(',','.')}
  else if(ld>=0){if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'')}
  const n=parseFloat(s);return isFinite(n)?n:0}
const ls={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function asciiUp(s){const map={'Ç':'C','Ğ':'G','İ':'I','Ö':'O','Ş':'S','Ü':'U'};return String(s||'').toLocaleUpperCase('tr-TR').replace(/[ÇĞİÖŞÜ]/g,c=>map[c])}
function normKey(s){const words=asciiUp(s).replace(/[^A-Z ]+/g,' ').split(/\s+/).filter(w=>w.length>=2&&!['TR','TUR','ISTANBUL','ANKARA','IZMIR','POS','AS','LTD','STI','TIC','SAN','VE','MAGAZACILIK','GIDA'].includes(w));return words.slice(0,2).join(' ')}
const firstWord=s=>normKey(s).split(' ')[0]||'';
const normProd=s=>asciiUp(s).replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const normSize=s=>asciiUp(s).replace(/\s+/g,'').replace(',','.');

/* ===================== DURUM ===================== */
let db=null,base=null,sampleFn=null,sampleCaps=null;
const S={months:{},amonths:{},rmonths:{},tx:[],arch:[],receipts:[],cards:[],accounts:[],persons:[],budgets:[],assets:[],debts:[],plans:[],stmts:[],cats:[],recs:[],
  merch:{},prod:{map:{},alias:{}},prices:{},meta:{},loaded:false,error:null};
let tab=ls.get('kd3_tab','ana');if(tab==='arsiv')tab='harcama';
let viewMonth=today().slice(0,7);
let archMonth=null;
let txWho=ME,txQuery='',archQuery='';
let fisView=ls.get('kd_fis','urun'),fisQuery='';
let RV=null,RC=null;
const START=()=>S.meta.start||DEFAULT_START;
function targetDate(){const v=ls.get('kd3_target','');if(v&&v>=today())return v;const d=new Date();return d.getDate()<20?dayIn(d.getFullYear(),d.getMonth(),20):dayIn(d.getFullYear(),d.getMonth()+1,20)}

const personName=id=>id===ME?'Ben':(S.persons.find(p=>p.id===id)?.name||S.meta.archPeople?.[id]||'Diğer kişi');
const cardById=id=>S.cards.find(c=>c.id===id);
const holderCard=pid=>S.cards.find(c=>c.holderId===pid);
const srcLabel=t=>t.cardId?(cardById(t.cardId)?.name||'Kart'):(t.account||'Nakit');
const srcVal=t=>t.cardId?'c:'+t.cardId:(t.account?'a:'+t.account:'');
const srcParse=v=>{v=String(v||'');if(v.startsWith('c:'))return {cardId:v.slice(2),account:''};if(v.startsWith('a:'))return {cardId:'',account:v.slice(2)};return {cardId:'',account:''}};
const hasDays=c=>c&&c.cutDay>0&&c.dueDay>0;
function catTree(){const t=JSON.parse(JSON.stringify(S.catTree||CAT_TREE));S.cats.forEach(c=>{if(!c.main)return;if(!t[c.main])t[c.main]=[];if(c.sub&&!t[c.main].includes(c.sub))t[c.main].push(c.sub)});return t}
const saveTree=async t=>{S.catTree=t;await put({id:'cattree',k:'cattree',tree:t,icons:S.catIcons||{}});for(const c of S.cats)await del(c.id)};
const catVal=(m,s)=>(m||'Diğer')+'|'+(s||'');
const catLabel=(m,s)=>s?`${m} › ${s}`:(m||'Diğer');
const catPromptList=()=>Object.entries(catTree()).flatMap(([m,s])=>[m,...s.map(x=>m+' › '+x)]);
function parseCat(str){if(!str)return null;const[m,s]=String(str).split(/›|\|/).map(x=>x.trim());const t=catTree();if(!t[m])return null;return {category:m,sub:s&&t[m].includes(s)?s:''}}

/* ===================== HESAPLAR ===================== */
function portions(t){
  const n=Math.max(1,Math.round(t.inst||1));const per=t.amount/n;
  if(n===1){const cd=t.cardId?S.cards.find(c=>c.id===t.cardId):null;return [{...t,pdate:t.date,pamount:t.amount,pi:1,pn:1,pcut:cd&&hasDays(cd)?(t.stmtCut||cutFor(cd,t.date)):null}]}
  const done=t.nextDate?Math.max(0,Math.round(t.instDone||0)):0;let first=t.nextDate||t.date;
  const card=t.cardId?S.cards.find(c=>c.id===t.cardId):null;
  /* kesim günü sonradan değiştiyse (25→24) kayıtlı taksit tarihini en yakın kesime oturt */
  if(t.nextDate&&card&&hasDays(card)){const near=cutCands(card,t.nextDate).find(c=>Math.abs(daysBetween(c,t.nextDate))<=3);if(near)first=near}
  const out=[];let cut=card&&hasDays(card)?cutFor(card,first):null;
  for(let j=0;j<n-done;j++){
    let pd;
    if(j===0)pd=first;
    else if(cut){cut=cutFor(card,addDays(cut,1));pd=cut}
    else pd=addMonths(first,j);
    out.push({...t,pdate:pd,pamount:per,pi:done+j+1,pn:n,pcut:cut?(j===0&&t.stmtCut?t.stmtCut:cutFor(card,pd)):null});
  }
  return out;
}
let _ep=null;
const livePortions=()=>_ep||(_ep=S.tx.filter(t=>t.type==='gider').flatMap(portions));
/* kesim tarihleri: ekstreden öğrenilen gerçek tarihler (card.cuts {kesim:sonÖdeme}) aynı aydaki hesaplanan tarihin yerine geçer */
function cutCands(card,dateStr){const d=parse(dateStr);const known=card.cuts||{};const out=[];for(let i=-2;i<=2;i++){const g=dayIn(d.getFullYear(),d.getMonth()+i,card.cutDay);out.push(Object.keys(known).find(x=>x.slice(0,7)===g.slice(0,7))||g)}return out.sort()}
/* kesim/son ödeme günü elle değişince: geçmiş kesimler kalır, gelecektekiler yeni günlere göre yeniden hesaplanır */
function fixCuts(cuts,cutDay,dueDay,oldCut){const out={};const t=today();Object.entries(cuts||{}).forEach(([k,v])=>{if(k<=t){out[k]=v;return}if(oldCut&&oldCut!==cutDay)return;out[k]=dueFor({cutDay,dueDay},k)});return out}
function cutFor(card,dateStr){return cutCands(card,dateStr).find(c=>c>=dateStr)}
function dueFor(card,cut){if(card.cuts&&card.cuts[cut])return card.cuts[cut];const d=parse(cut);return card.dueDay>card.cutDay?dayIn(d.getFullYear(),d.getMonth(),card.dueDay):dayIn(d.getFullYear(),d.getMonth()+1,card.dueDay)}
function prevCut(card,cut){const c=cutCands(card,cut).filter(x=>x<cut);return c[c.length-1]}
function lastCut(card){const t=today();const c=cutCands(card,t).filter(x=>x<=t);return c[c.length-1]}
function stmt(card,cut){
  const items=livePortions().filter(p=>p.cardId===card.id&&(p.pcut||cutFor(card,p.pdate))===cut);
  const by={};let total=0;items.forEach(p=>{by[p.personId]=(by[p.personId]||0)+p.pamount;total+=p.pamount});
  const rec=S.stmts.find(s=>s.cardId===card.id&&s.cut===cut);
  return {cut,due:rec?.due||dueFor(card,cut),items,by,total,paid:!!rec?.paid,checked:!!rec?.checked,bankTotal:rec?.bankTotal,rec};
}
function cardState(c){
  if(!hasDays(c)){const T=cardTotals(c);return {noDays:true,last:{total:0,by:{},paid:true,cut:today(),due:today(),items:[]},open:{total:T.spent,by:T.by,cut:'9999-12-31',due:'9999-12-31',items:T.billed},future:T.fut,futTotal:T.futT,debt:T.debt+T.futT,T}}
  const lc=lastCut(c);const last=stmt(c,lc);const open=stmt(c,cutFor(c,addDays(lc,1)));
  const future=livePortions().filter(p=>p.cardId===c.id&&(p.pcut||p.pdate)>open.cut);
  const futTotal=future.reduce((a,p)=>a+p.pamount,0);
  const T=cardTotals(c);
  return {last,open,future,futTotal:T.futT,debt:T.debt+T.futT,T};
}
/* kartın toplam borcu: kesim tarihinden bağımsız, girilen tüm harcamalar (bu döneme kadar düşen taksitler dahil) − karta yapılan ödemeler */
function cardTotals(c){
  const open=hasDays(c)?cutFor(c,today()):'9999-12-31';
  const ps=livePortions().filter(p=>p.cardId===c.id);
  const billed=ps.filter(p=>(p.pcut||p.pdate)<=open),fut=ps.filter(p=>(p.pcut||p.pdate)>open);
  const by={};billed.forEach(p=>by[p.personId]=(by[p.personId]||0)+p.pamount);
  const spent=billed.reduce((a,p)=>a+p.pamount,0);
  const pays=S.tx.filter(t=>t.type==='transfer'&&t.toCardId===c.id&&t.date<=today());const paid=pays.reduce((a,t)=>a+t.amount,0);
  return {spent,paid,debt:spent-paid,futT:fut.reduce((a,p)=>a+p.pamount,0),by,billed,fut,pays,open};
}
/* kartta benim borcum: ödemeler kişilerin paylarına oranla dağıtılır; henüz düşmemiş taksitler ayrı */
function myCard(c,st){const T=st.T;const bm=T.by[ME]||0;const debt=Math.max(0,T.debt);const now=T.spent>0.5?debt*Math.max(0,bm)/T.spent:0;const fut=T.fut.filter(p=>p.personId===ME).reduce((a,p)=>a+p.pamount,0);return {now,fut,others:debt-now}}
/* ortak limit: limitOf ile bağlı kartlar ana kartın limitini paylaşır */
const limitRoot=c=>c.limitOf&&cardById(c.limitOf)?cardById(c.limitOf):c;
function limitInfo(c){const root=limitRoot(c);const group=S.cards.filter(x=>x.id===root.id||x.limitOf===root.id);const debt=group.reduce((a,x)=>a+(cardState(x)?.debt||0),0);return {limit:root.limit||0,debt,avail:(root.limit||0)-debt,group,root,shared:group.length>1}}
function cardInstallments(c){
  const st=cardState(c);const after=st?st.last.cut:today();
  return S.tx.filter(t=>t.type==='gider'&&t.cardId===c.id&&(t.inst||1)>1).map(t=>{
    const ps=portions(t).filter(p=>(p.pcut||p.pdate)>after);
    return ps.length?{t,left:ps.length,n:ps[0].pn,per:ps[0].pamount,leftTotal:ps.reduce((a,p)=>a+p.pamount,0),next:ps[0].pdate,personId:t.personId}:null;
  }).filter(Boolean).sort((a,b)=>b.leftTotal-a.leftTotal);
}
const isCashAcc=a=>asciiUp(a.name)==='NAKIT';
function accBalance(a){
  const at=a.balanceAt||0;let b=a.balanceAt?num(a.balance):0;const cashA=isCashAcc(a);const mine=n=>n===a.name||(cashA&&!n);
  const td=today();
  S.tx.forEach(t=>{
    if((t.ts||0)<=at)return;if(t.date>td)return;/* ileri tarihli: o gün gelene kadar bakiyeye dokunmaz */const amt=t.amount||0;
    if(mine(t.account)&&!t.cardId){if(t.type==='gelir'||t.type==='tahsilat')b+=amt;else if(t.type==='gider'||t.type==='verdim'||t.type==='transfer'||t.type==='odeme')b-=amt}
    if(t.type==='transfer'&&!t.toCardId&&(t.toAccount===a.name||(cashA&&!t.toAccount)))b+=amt;
  });
  return b;
}
function personLedger(pid,upto){
  const p=S.persons.find(x=>x.id===pid)||{};const since=p.since||'0000-00-00';const t=upto&&upto>today()?upto:today();
  const items=[];
  livePortions().filter(x=>x.personId===pid&&x.pdate<=t).forEach(x=>items.push({date:x.pdate,amt:x.pamount,label:(x.merchant||'Harcama')+(x.pn>1?` (${x.pi}/${x.pn})`:''),kind:'kart',src:srcLabel(x),id:x.id}));
  S.tx.filter(x=>x.personId===pid&&(x.type==='verdim'||x.type==='tahsilat')).forEach(x=>items.push({date:x.date,amt:x.type==='verdim'?x.amount:-x.amount,label:x.type==='verdim'?(x.merchant||'Verdim'):'Ödeme aldım',kind:x.type,src:srcLabel(x),id:x.id}));
  items.sort((a,b)=>b.date.localeCompare(a.date));
  const bal=(p.opening||0)+items.filter(i=>i.date>=since).reduce((a,i)=>a+i.amt,0);
  return {items,bal,since,opening:p.opening||0};
}
const debtLeft=d=>Math.max(0,(d.amount||0)-(d.payments||[]).reduce((a,p)=>a+(p.amount||0),0));
/* döviz cinsinden borç: kayıt kendi para biriminde tutulur, TL karşılığı güncel kurdan (Birikim → Fiyatlar) */
const CURS={TRY:['TL','₺'],USD:['Dolar','$'],EUR:['Euro','€']};
const curRate=c=>c==='USD'?num(S.prices?.usd):c==='EUR'?num(S.prices?.eur):1;
const debtTL=d=>debtLeft(d)*curRate(d.cur||'TRY');
const debtAmtTL=d=>(d.amount||0)*curRate(d.cur||'TRY');
const curFmt=(v,c)=>!c||c==='TRY'?TL(v):nfq.format(Math.round(v*100)/100)+' '+CURS[c][1];
/* taksitle ödeyen kişinin o aya ait gelen parası: erken gelen ödeme planMonth ile ait olduğu aya yazılır */
const planGot=(pl,mk)=>S.tx.filter(x=>x.type==='gelir'&&x.planId===pl.id&&(x.planMonth||x.date.slice(0,7))===mk).reduce((a,x)=>a+x.amount,0);
function planStatus(pl){
  const inc=S.tx.filter(x=>x.type==='gelir'&&x.planId===pl.id);const got=(pl.already||0)+inc.reduce((a,x)=>a+x.amount,0);
  const t=today();const d=parse(t);const gotThisMonth=inc.filter(x=>(x.planMonth||x.date.slice(0,7))===t.slice(0,7)).reduce((a,x)=>a+x.amount,0);
  const remaining=Math.max(0,(pl.total||0)-got);
  let next=null;if(remaining>0)next=gotThisMonth>=(pl.installment||0)?dayIn(d.getFullYear(),d.getMonth()+1,pl.day||1):dayIn(d.getFullYear(),d.getMonth(),pl.day||1);
  return {got,remaining,next};
}
function flows(T){
  const t=today();const ins=[],outs=[];
  S.cards.filter(hasDays).forEach(c=>{
    const st=cardState(c);
    [st.last,st.open].forEach(s=>{
      if(s.paid||s.total<=0.5||s.due>T)return;const est=s.cut>=t;
      outs.push({date:s.due,title:`${c.name} ödemesi`,sub:est?`Dönem açık, ${fmtD(s.cut)}'de kesilecek`:`Ekstre ${fmtD(s.cut)}`,amount:s.total,mine:s.by[ME]||0,ref:{t:'card',id:c.id},late:s.due<t});
      Object.entries(s.by).forEach(([pid,amt])=>{if(pid===ME||amt<=0.5)return;const v=Math.min(amt,Math.max(0,personLedger(pid,s.cut).bal));if(v<=0.5)return;
        ins.push({date:s.due,title:personName(pid),sub:`${c.name} ${holderCard(pid)?.id===c.id?'ek kart':'payı'}${est?' · dönem açık':''}`,amount:v,ref:{t:'person',id:pid},late:s.due<t})});
    });
  });
  S.plans.forEach(pl=>{const s=planStatus(pl);if(!s.next)return;let d=s.next,left=s.remaining;while(d<=T&&left>0.5){const v=Math.min(pl.installment||left,left);ins.push({date:d,title:pl.who||pl.name,sub:pl.name+' taksiti',amount:v,ref:{t:'plan',id:pl.id},late:d<t});left-=v;d=addMonths(d,1)}});
  S.debts.filter(d=>!d.paid&&debtLeft(d)>0&&d.dueDate&&d.dueDate<=T).forEach(d=>(d.dir==='alacak'?ins:outs).push({date:d.dueDate,title:d.who,sub:d.note||(d.dir==='alacak'?'Alacak':'Borç'),amount:debtTL(d),ref:{t:'debt',id:d.id},late:d.dueDate<t}));

async function fileToParts(file){
  const img=await loadImg(file);const W=img.naturalWidth,H=img.naturalHeight;const parts=[];
  const segH=Math.round(W*1.5),step=Math.round(segH*0.88);
  const ys=H>segH*1.15?(()=>{const a=[];for(let y=0;y<H;y+=step){a.push(Math.min(y,Math.max(0,H-segH)));if(y+segH>=H)break}return [...new Set(a)]})():[0];
  for(const y of ys){const h=ys.length>1?Math.min(segH,H-y):H;const sc=Math.min(1,1568/Math.max(W,h));const c=document.createElement('canvas');c.width=Math.round(W*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(img,0,y,W,h,0,0,c.width,c.height);parts.push(c.toDataURL('image/jpeg',0.86).split(',')[1])}

function forecastCat(cat,mk){const t=today();const by=mineCats(mk);const one=c=>{const v=by[c]?.v||0;if(mk!==t.slice(0,7))return v;const d=parse(t);const days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();const el=d.getDate();if(el>=days)return v;
    const hist=[1,2,3].map(i=>mineCats(shiftMonth(mk,-i))[c]?.v||0);const n=hist.filter(x=>x>0).length;const avg=n?hist.reduce((a,x)=>a+x,0)/3:null;
    return avg!=null?Math.max(v,v+avg*(days-el)/days):((by[c]?.items||[]).length>=3?v/el*days:v)};
  if(cat)return one(cat);const cats=new Set([...Object.keys(by),...[1,2,3].flatMap(i=>Object.keys(mineCats(shiftMonth(mk,-i))))]);return [...cats].reduce((a,c)=>a+one(c),0)}

function accAmt(a,b){return a.balanceAt||isCashAcc(a)?TL(b):`${TL(b)}<small>bakiye girilmedi</small>`}

function accountSheet(id){

}
let cardReorder=false;
function nextPay(c,st){if(!st)return null;if(!st.last.paid&&st.last.total>0.5)return {amt:st.last.total,due:st.last.due,mine:st.last.by[ME]||0,kesik:true};return {amt:st.open.total,due:st.open.due,mine:st.open.by[ME]||0,kesik:false}}

  const my=states.map(x=>myCard(x.c,x.st));const myNow=my.reduce((a,m)=>a+m.now,0),myFut=my.reduce((a,m)=>a+m.fut,0);
  const rows=states.map(({c,st},i)=>{const m=myCard(c,st);const np=st.noDays?null:nextPay(c,st);const LI=limitInfo(c);const pct=LI&&LI.limit?Math.min(100,LI.debt/LI.limit*100):0;
    return `<div class="crow ${cardReorder?'':'tap'}" ${cardReorder?'':`data-act="cardopen" data-id="${c.id}"`}>

    </div>`}).join('');
  return `<section class="sec"><div class="eyebrow">Tüm kartlarda benim borcum</div><div class="total">${TL(myNow)}</div>${myFut>0.5?`<div class="small muted">+ henüz düşmemiş taksitlerim ${TL(myFut)}</div>`:''}
    <div class="kv" style="margin-top:10px"><span class="k">Kartların toplam borcu</span><b>${TL(now)}</b><span class="k">Başkalarının payı</span><b style="color:var(--other)">${TL(now-myNow)}</b>${fut>0.5?`<span class="k">Henüz düşmemiş taksitler</span><b>${TL(fut)}</b>`:''}<span class="k">Toplam limit</span><b>${TL(lim)}</b><span class="k">Kullanılabilir</span><b style="color:var(--plus)">${TL(lim-debt)}</b></div>
    ${lim?`<div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,debt/lim*100)}%"></i></div>`:''}</section>

let cardRange={};
function cardBlock(c,st){
  const T=st.T;const LI=limitInfo(c);const lim=LI.limit;const others=LI.debt-st.debt;const np=nextPay(c,st);
  const rg=cardRange[c.id]||{};const rFrom=rg.from||'',rTo=rg.to||'';

  return `<section class="sec">
    <div style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1;min-width:0"><div class="eyebrow">Toplam borç</div><div class="total">${TL(T.debt)}</div>${(()=>{const m=myCard(c,st);return Math.abs(m.now-T.debt)>1?`<div style="font-weight:700;color:var(--accent);margin-top:2px">Benim payım ${TL(m.now)}</div>`:''})()}${c.holderId?`<span class="chip oth">${esc(personName(c.holderId))} kullanıyor</span>`:''}</div><button class="btn ghost sm" data-act="editcard" data-id="${c.id}">Düzenle</button></div>
    ${(()=>{const D=debtSplit(c,st);return D&&D.old>0.5?`<div class="kv" style="margin-top:10px"><span class="k" style="font-weight:700;color:var(--ink)">Geçmiş ekstreden kalan</span><b style="color:var(--warn)">${TL(D.old)}</b><span class="k">${D.oldDue?`son ödeme ${fmtD(D.oldDue)}`:''}</span><b><button class="btn sm" data-act="paycard" data-id="${c.id}">Kalanı öde</button></b><span class="k" style="font-weight:700;color:var(--ink)">Bu dönem harcamaları</span><b>${TL(D.cur)}</b><span class="k">kesim ${fmtD(st.open.cut)}</span><b></b></div>`:''})()}

    ${lim?`<div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,Math.max(0,st.debt)/lim*100)}%"></i>${LI.shared?`<i style="width:${Math.min(100,Math.max(0,others)/lim*100)}%;background:var(--other)"></i>`:''}</div>`:''}
    <div class="box"><span class="eyebrow">Kimin ne kadar harcadığı</span>${splitRows(T.by,c.id,'all')}</div>
    ${!st.noDays&&!st.last.paid&&st.last.total>0.5?periodBox(c,st.last,true):''}
    ${!st.noDays&&st.open.total>0.5?periodBox(c,st.open,false):''}
    <div class="btnrow" style="margin-top:10px"><button class="btn sm ghost" data-act="lump" data-id="${c.id}" data-m="stmt">Ekstre borcunu gir</button><button class="btn sm ghost" data-act="lump" data-id="${c.id}" data-m="open">Dönem içi kullanımı gir</button></div>
    <div class="btnrow" style="margin-top:8px"><button class="btn sm" data-act="paycard" data-id="${c.id}">Karta ödeme yaptım</button>${c.holderId?'':`<button class="btn ghost sm" data-act="spends" data-v="${c.id}">Nereye harcadım</button>`}</div>
    <details style="margin-top:12px" ${(rFrom||rTo)?'open':''}><summary>Tarih aralığı seç</summary>
      <form data-form="crange" style="margin-top:8px"><input type="hidden" name="id" value="${c.id}"><div class="two"><label class="f">Başlangıç<input type="date" name="from" value="${rFrom}"></label><label class="f">Bitiş<input type="date" name="to" value="${rTo}"></label></div><div class="btnrow"><button class="btn sm" type="submit">Göster</button>${(rFrom||rTo)?`<button class="btn sm ghost" type="button" data-act="crclear" data-id="${c.id}">Temizle</button>`:''}</div></form>
      ${inRange?`<div class="box"><div class="sumline"><span>${rFrom?fmtD(rFrom):'Başından'} – ${rTo?fmtD(rTo):'bugün'}</span><b>${TL(inRange.reduce((a,p)=>a+p.pamount,0))}</b></div>${Object.entries(rBy).map(([p,v])=>`<div class="sumline"><span>${p===ME?'Benim':esc(personName(p))}</span><b>${TL(v)}</b></div>`).join('')}<div class="small muted">Bu aralık sadece görüntüleme içindir, toplam borcu etkilemez.</div></div>${[...inRange].sort((a,b)=>b.pdate.localeCompare(a.pdate)).map(p=>txRow({...p,amount:p.pamount,_portion:p.pn>1?`${p.pi}/${p.pn}`:'',_date:true})).join('')}`:''}

/* toplam borcun ayrımı: ödemeler önce eski ekstrelere sayılır; kalan eski borç + bu dönem */
function debtSplit(c,st){if(!st||st.noDays)return null;const debt=Math.max(0,st.T.debt);const cur=Math.max(0,Math.min(debt,st.open.total));const old=debt-cur;return {old,cur,oldDue:old>0.5?st.last.due:''}}
function periodBox(c,s,kesik){const mine=s.by[ME]||0;const oth=Object.entries(s.by).filter(([p,v])=>p!==ME&&v>0.5);
  const D=kesik?debtSplit(c,cardState(c)):null;
  return `<div class="box"><div class="sumline"><span>${kesik?`Kesilen ekstre (${fmtD(s.cut)})`:`Bu dönem (kesim ${fmtD(s.cut)})`}</span><b>${TL(s.total)}</b></div>${kesik&&D&&D.old<s.total-0.5?`<div class="sumline"><span style="font-weight:700">Ödenmeyen kalan</span><b style="color:var(--warn)">${TL(D.old)}</b></div>`:''}
    <div class="sumline"><span style="font-weight:700">Benim payım</span><b style="color:var(--accent)">${TL(mine)}</b></div>
    ${oth.map(([p,v])=>`<div class="sumline"><span>${esc(personName(p))}</span><b style="color:var(--other)">${TL(v)}</b></div>`).join('')}
    <div class="sumline"><span>Son ödeme</span><b>${fmtD(s.due)}</b></div>${kesik?(s.checked?'<span class="chip ok">Ekstre yüklendi, bu harcamalar yeni döneme karışmaz</span>':'<div class="small muted">Ekstreyi yüklersen içindeki harcamalar bu ekstreye sabitlenir.</div>'):bankCmpLine(c,s)}</div>`}
/* satır satır girmeden, ekstre borcunu ya da dönem içi kullanımı toplam tutar olarak gir */
function formLump(cardId,mode){const c=cardById(cardId);const holder=c.holderId||'';const st=cardState(c);
  const isS=mode==='stmt';const cut=isS?(st&&!st.noDays?st.last.cut:today()):(st&&!st.noDays?st.open.cut:'');

const subNorm=s=>asciiUp(s||'').replace(/[^A-Z0-9]/g,'');

function subsPayments(){const from=addMonths(today(),-6);const L=[];

  return L}
const subStat=items=>{if(!items.length)return {months:0,none:true};const last=items.reduce((a,x)=>x.d>a.d?x:a);const months=new Set(items.map(x=>x.d.slice(0,7)));

  Object.entries(by).forEach(([k,arr])=>{arr.sort((a,b)=>a.a-b.a);const cl=[];arr.forEach(x=>{const c=cl.find(c=>near(x.a,c.ref));if(c){c.items.push(x)}else cl.push({ref:x.a,items:[x]})});

      if(!isAbo){if(months.size<Math.min(3,allM.size))return;const perM=arr.length/new Set(arr.map(x=>x.d.slice(0,7))).size;if(c.items.length/arr.length<0.6&&perM>2.5)return}

    return {k:normKey(it.name)||it.name,id:it.id,name:it.name,note:it.note||'',amt:it.amt||st.lastAmt||0,...st,manual:true,items}});

  E.add.filter(k=>!defs.some(d=>d.k===k)).forEach(k=>{const items=by[k]||[];const st=subStat(items);defs.push({k,name:st.lastName||k,amt:st.lastAmt||0,...st,manual:true,items})});

/* ===== ANALİZ SEKMESİ: seçili ayın harcaması tek ekranda, grafiklerle =====

const VIZN=6;
function vizColors(){const end=today().slice(0,7);const sum={};for(let i=0;i<12;i++)Object.entries(mineCats(shiftMonth(end,-i))).forEach(([c,o])=>sum[c]=(sum[c]||0)+o.v);
  const top=Object.entries(sum).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,VIZN).map(x=>x[0]);const m={};top.forEach((c,i)=>m[c]=`var(--v${i+1})`);return m}
const TLk=v=>{const a=Math.abs(v),s=v<0?'−':'';return s+(a>=1e6?nf1(a/1e6)+' mn':a>=1e3?nf0.format(Math.round(a/1e3))+' bin':nf0.format(Math.round(a)))};
const nf1=v=>(Math.round(v*10)/10).toString().replace('.',',');

const dimOf=mk=>{const[y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate()};

function cumDays(mk){const n=dimOf(mk);const d=new Array(n+1).fill(0);Object.values(mineCats(mk)).forEach(c=>c.items.forEach(p=>{const dd=+String(p.pdate||p.date).slice(8,10);if(dd>=1&&dd<=n)d[dd]+=p.pamount}));for(let i=1;i<=n;i++)d[i]+=d[i-1];return d}

function viewAnaliz(){

    <button class="vcmpbtn" data-act="cmp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 20V10M12 20V4M17 20v-7"/></svg>İki ayı karşılaştır ›</button>
  </section>`;
  if(future||(!tot&&!inc))return h+`<section class="sec"><div class="empty">${future?'Bu ay henüz gelmedi.':'Bu ay için harcama kaydı yok.'}</div></section>`+vizMore(mk);

function vizInsights(mk,by,avgBy,tot,avg,isCur,inc){const out=[];const val=c=>isCur?forecastCat(c,mk):(by[c]?.v||0);
  const diffs=[...new Set([...Object.keys(by),...Object.keys(avgBy)])].map(c=>({c,d:val(c)-(avgBy[c]||0),a:avgBy[c]||0,v:val(c)})).filter(x=>Math.abs(x.d)>=500);
  const up=diffs.filter(x=>x.d>0).sort((a,b)=>b.d-a.d)[0],dn=diffs.filter(x=>x.d<0).sort((a,b)=>a.d-b.d)[0];
  if(up)out.push({k:'up',t:`<b>${esc(up.c)}</b> ${isCur?'bu hızla':''} ortalamadan <b>${TL(up.d)}</b> fazla${up.a>0?` (%${Math.round(up.d/up.a*100)})`:''}`});
  if(dn)out.push({k:'down',t:`<b>${esc(dn.c)}</b> ${isCur?'bu hızla':''} ortalamadan <b>${TL(-dn.d)}</b> az`});
  const top=Object.entries(by).sort((a,b)=>b[1].v-a[1].v)[0];if(top&&tot>0)out.push({k:'neu',t:`En büyük kalem <b>${esc(top[0])}</b>: harcamanın %${Math.round(top[1].v/tot*100)}'i`});
  if(!isCur&&inc>0){const r=Math.round((inc-tot)/inc*100);out.push({k:r>=0?'down':'up',t:r>=0?`Gelirinin <b>%${r}</b>'ini biriktirdin`:`Gelirinden <b>${TL(tot-inc)}</b> fazla harcadın`})}
  return out.slice(0,4)}

/* kategori halkası + liste; küçük kategoriler "Diğerleri" altında toplanır */
/* kategori halkası: dilim adları dışarıda yazılı; ince dilimler de en az 5° çizilir; dokununca dilim seçilir ve ortada adı/tutarı görünür, ikinci dokunuşta ayrıntı açılır */
let DSEL=null;
function vizDonut(by,tot,avgBy,COL,isCur,mk){
  const all=Object.entries(by).filter(x=>x[1].v>0).sort((a,b)=>b[1].v-a[1].v);
  const main=all.filter(([c])=>COL[c]);const rest=all.filter(([c])=>!COL[c]);const restV=rest.reduce((a,x)=>a+x[1].v,0);
  const segs=[...main.map(([c,o])=>({c,v:o.v,col:COL[c]})),...(restV>0?[{c:'Diğerleri',v:restV,col:'var(--v0)',rest:true}]:[])];
  const W=340,H=250,cx=170,cy=125,R=74,r=47,T=Math.max(1,segs.reduce((a,s)=>a+s.v,0));
  /* görsel açı: en az 5°; fazlası büyük dilimlerden orantılı alınır */

  let a0=-Math.PI/2;segs.forEach((s,i)=>{s.a1=a0;s.a2=a0+ang[i];s.mid=(s.a1+s.a2)/2;a0=s.a2});

      :`<path d="${arc(s.a1,s.a2,R,r)}" fill="${s.col}" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round" class="dseg${DSEL&&DSEL!==s.c?' dim':''}" data-c="${esc(s.c)}"/>`;
    /* geniş dokunma alanı: dilimin iki yanından halkanın dışına kadar, en az 14° */

    svg+=`<path d="${arc(s.a1-pad,s.a2+pad,R+18,r-10)}" fill="transparent" class="tap" data-act="${act}" data-c="${esc(s.c)}" ${vizTip(`${s.c} · ${TL(s.v)} · %${pct}`)}/>`});
  /* dış etiketler: sağ ve sol sütun, üst üste binmesin diye aralanır */
  const side={L:[],R:[]};segs.forEach(s=>{const[x,y]=P(R+12,s.mid);(Math.cos(s.mid)>=0?side.R:side.L).push({s,y,ay:y,ax:x})});
  const GAP=27,top=16,bot=H-14;
  Object.values(side).forEach(L=>{L.sort((a,b)=>a.y-b.y);for(let i=0;i<L.length;i++)L[i].y=Math.max(L[i].y,i?L[i-1].y+GAP:top);
    for(let i=L.length-1;i>=0;i--)L[i].y=Math.min(L[i].y,i<L.length-1?L[i+1].y-GAP:bot-GAP+10);for(let i=0;i<L.length;i++)L[i].y=Math.max(L[i].y,i?L[i-1].y+GAP:top)});
  const short=n=>n.length>11?n.slice(0,10)+'…':n;

    svg+=`<path d="M${f(px)} ${f(py)}L${f(ex)} ${f(o.y)}L${f(tx-d*3)} ${f(o.y)}" class="dlead${DSEL&&DSEL!==s.c?' dim':''}"/>`;

  const sel=DSEL&&segs.find(s=>s.c===DSEL);
  svg+=sel?`<text x="${cx}" y="${cy-8}" text-anchor="middle" class="vdc1">${esc(short(sel.c))}</text><text x="${cx}" y="${cy+11}" text-anchor="middle" class="vdc2">${TLk(sel.v)}</text><text x="${cx}" y="${cy+25}" text-anchor="middle" class="vdc1 lnk">ayrıntı ›</text>`
    :`<text x="${cx}" y="${cy-4}" text-anchor="middle" class="vdc1">${all.length} kategori</text><text x="${cx}" y="${cy+14}" text-anchor="middle" class="vdc2">${TLk(tot)}</text>`;
  svg+=`</svg>`;

    ${rest.length?`<details class="vrest" id="vrest"><summary>${row('Diğerleri',restV,'var(--v0)',false)}</summary>${rest.map(([c,o])=>row(c,o.v,'var(--v0)',true)).join('')}</details>`:''}</div>
    <p class="small muted" style="margin:8px 0 0">Halkada bir dilime ya da yazısına dokun: seçilir, bir daha dokununca ayrıntı açılır. ▲▼ son 6 ayın ortalamasına göre${isCur?' (ay sonu tahminiyle)':''}.</p>`;
}

function archMap(t){if(t.type!=='gider')return t;const A=S.catIcons?.__alias;let c=t.category||'',s=t.sub||'';

/* birikimli harcama çizgisi: bu ay, 6 ay ortalaması, (bu aysa) ay sonu tahmini */

  s+=`<path d="${pts(d=>c[d],1,td)}" class="vl cur"/><circle cx="${x(td)}" cy="${y(c[td])}" r="4.5" class="vpt cur"/>`;

    if(x.i>0)s+=`<path d="${vbarPath(a,y(x.i),w,y(0)-y(x.i),true)}" style="fill:var(--v3)" opacity="${sel?1:.8}"/>`;

  V.forEach((x,j)=>{const x0=L+bw*j+3,w=bw-6;const hh=h(x.n);if(hh>0.5){const up=x.n>=0;

  const full=V.filter(x=>!x.part&&(x.i>0||x.g>0));const sumI=full.reduce((a,x)=>a+x.i,0),sumN=full.reduce((a,x)=>a+x.n,0);const rate=sumI>0?Math.round(sumN/sumI*100):null;

    ${tic?'<p class="small muted" style="margin:6px 0 0">Ticari gelir ve ticari giderler hariç.</p>':''}`;

function vbarPathDown(x,y,w,h){const r=Math.min(4,h,w/2);return `M${x} ${y}V${y+h-r}Q${x} ${y+h} ${x+r} ${y+h}H${x+w-r}Q${x+w} ${y+h} ${x+w} ${y+h-r}V${y}Z`}

function vbarPath(x,y,w,h,round){if(h<=0)return '';const r=round?Math.min(4,h,w/2):0;return `M${x} ${y+h}V${y+r}${r?`Q${x} ${y} ${x+r} ${y}`:''}H${x+w-r}${r?`Q${x+w} ${y} ${x+w} ${y+r}`:''}V${y+h}Z`}

/* kategori başına ortalamadan fark: sağa fazla (kırmızı), sola az (mavi) */
function vizDiverge(mk,by,avgBy,isCur){
  const val=c=>isCur?forecastCat(c,mk):(by[c]?.v||0);
  const L=[...new Set([...Object.keys(by),...Object.keys(avgBy)])].map(c=>({c,d:val(c)-(avgBy[c]||0)})).filter(x=>Math.abs(x.d)>=100).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,6).sort((a,b)=>b.d-a.d);
  if(!L.length)return '<div class="empty">Kategoriler ortalamaya çok yakın.</div>';
  const mx=Math.max(...L.map(x=>Math.abs(x.d)));
  return `<div class="vdiv">${L.map(x=>{const w=Math.abs(x.d)/mx*50;return `<div class="vdr tap" data-act="cat" data-c="${esc(x.c)}" ${vizTip(`${x.c}: ortalama ${TL(avgBy[x.c]||0)} · ${isCur?'tahmin':'bu ay'} ${TL(val(x.c))}`)}><span class="n">${esc(x.c)}</span><span class="track"><span class="mid"></span><i class="${x.d>0?'up':'down'}" style="${x.d>0?`left:50%`:`right:50%`};width:${w}%"></i></span><b class="${x.d>0?'up':'down'}">${x.d>0?'+':'−'}${TLk(Math.abs(x.d))}</b></div>`}).join('')}</div>
    <div class="vkey"><span><i class="sq down"></i>Ortalamadan az</span><span><i class="sq up"></i>Ortalamadan fazla</span></div>${isCur?'<p class="small muted" style="margin:4px 0 0">Bu ay için ay sonu tahmini kullanılıyor.</p>':''}`;
}

/* ayrıntılar: varsayılan kapalı */

/* grafik bilgi kutusu: fareyle üstüne gelince ya da parmakla dokununca/kaydırınca */
(function(){let tipEl=null;const show=(el,ev)=>{if(!tipEl){tipEl=document.createElement('div');tipEl.className='vtip';document.body.append(tipEl)}
  tipEl.textContent=el.dataset.tip;tipEl.hidden=false;const r=tipEl.getBoundingClientRect();let x=ev.clientX-r.width/2,y=ev.clientY-r.height-14;x=Math.max(8,Math.min(innerWidth-r.width-8,x));if(y<8)y=ev.clientY+18;tipEl.style.left=x+'px';tipEl.style.top=y+'px';
  const svg=el.ownerSVGElement;const xh=svg&&svg.querySelector('.vxh');if(xh){if(el.dataset.cx){xh.setAttribute('x1',el.dataset.cx);xh.setAttribute('x2',el.dataset.cx);xh.style.display=''}else xh.style.display='none'}};
  const hide=()=>{if(tipEl)tipEl.hidden=true;document.querySelectorAll('.vxh').forEach(x=>x.style.display='none')};
  const at=ev=>{const el=document.elementFromPoint(ev.clientX,ev.clientY);return el&&el.closest&&el.closest('[data-tip]')};
  document.addEventListener('pointermove',ev=>{const el=at(ev);if(el)show(el,ev);else hide()},{passive:true});
  document.addEventListener('pointerdown',ev=>{const el=at(ev);if(el)show(el,ev);else hide()},{passive:true});
  document.addEventListener('scroll',hide,{passive:true,capture:true});})();

function txRow(x){
  const ro=x.arch;const plus=x.type==='gelir'||x.type==='tahsilat'||(x.type==='gider'&&x.amount<0);let s;
  if(x.type==='gelir')s=`<span class="chip ok">${esc(x.source||'Gelir')}</span> ${esc(srcLabel(x))}`;
  else if(x.type==='tahsilat')s=`<span class="chip ok">Ödeme aldım</span> ${esc(personName(x.personId))} · ${esc(srcLabel(x))}`;
  else if(x.type==='verdim')s=`<span class="chip oth">${esc(personName(x.personId))}</span> verdim`;
  else if(x.type==='transfer')s=`<span class="chip">Transfer</span> ${esc(srcLabel(x))} → ${esc(x.toCardId?(cardById(x.toCardId)?.name||'Kart'):(x.toAccount||'Nakit'))}`;
  else if(x.type==='duzeltme')s=`<span class="chip">Düzeltme</span>`;
  else if(x.type==='odeme')s=`<span class="chip">Planlı ödeme</span> ${esc(srcLabel(x))}`;
  else if(x.personId&&x.personId!==ME)s=`<span class="chip oth">${esc(personName(x.personId))}</span> ${esc(srcLabel(x))}${x._portion?` · taksit ${x._portion}`:''}`;

const ownerOf=a=>(a.owner||'').trim()||'Kendim';
function assetGroups(rows){const g={};rows.forEach(r=>{const k=r.lent?'Borç verdiğim':r.type==='esya'?'Araç ve eşyalar':ownerOf(r);(g[k]=g[k]||{name:k,rows:[],val:0}).rows.push(r);g[k].val+=r.val});
  const order=k=>k==='Kendim'?0:k==='Borç verdiğim'?9:k==='Araç ve eşyalar'?8:1;
  return Object.values(g).map(x=>{const q={};x.rows.forEach(r=>q[r.type]=(q[r.type]||0)+r.qty);return {...x,qty:Object.entries(q).map(([t,v])=>nfq.format(v)+' '+(ASSET_TYPES[t]||t)).join(' · ')}}).sort((a,b)=>order(a.name)-order(b.name)||a.name.localeCompare(b.name,'tr'))}
/* maliyet: alışta ödenen TL ve o günkü kurlarla dolar/euro maliyeti; bugünkü değer bugünkü kurlarla */
function pnl(list,P){const c={tl:0,usd:0,eur:0,vtl:0,vusd:0,veur:0,nU:0,nE:0,n:0};const U=num(P.usd),E=num(P.eur);
  list.forEach(r=>{if(!(r.costTL>0))return;const v=aVal(r,P);c.n++;c.tl+=r.costTL;c.vtl+=v;if(r.usdRate>0&&U>0){c.usd+=r.costTL/r.usdRate;c.vusd+=v/U;c.nU++}if(r.eurRate>0&&E>0){c.eur+=r.costTL/r.eurRate;c.veur+=v/E;c.nE++}});return c}
function pnlLine(c,big){if(!c.n)return '';const f=(gain,base,sym,fmt)=>{const pc=base>0?gain/base*100:0;return `<span style="color:${gain>=0?'var(--plus)':'var(--crit)'};font-weight:700">${gain>=0?'+':'−'}${fmt(Math.abs(gain))}${sym} (${pc>=0?'+':'−'}%${Math.abs(pc).toFixed(1).replace(".",",")})</span>`};const nf0=v=>nfq.format(Math.round(v));
  const parts=[`TL ${f(c.vtl-c.tl,c.tl,' ₺',nf0)}`];if(c.nU)parts.push(`Dolar ${f(c.vusd-c.usd,c.usd,' $',nf0)}`);if(c.nE)parts.push(`Euro ${f(c.veur-c.eur,c.eur,' €',nf0)}`);
  return `<div class="${big?'':'small'}" style="margin-top:3px">${big?`Maliyet ${TL(c.tl)}${c.nU?` · ${nf0(c.usd)} $`:''}${c.nE?` · ${nf0(c.eur)} €`:''}<br>`:''}${parts.join(' · ')}</div>`}
function assetsSheet(){
  const P=S.prices||{};const rows=S.assets.map(a=>({...a,pr:aPrice(P,a.type),val:aVal(a,P)}));const total=rows.reduce((s,r)=>s+r.val,0);

  if(hist.length>=2&&S.assets.length){const vals=hist.map(([,h])=>S.assets.reduce((s,a)=>s+aVal(a,h),0));const mn=Math.min(...vals),mx=Math.max(...vals),W=320,H=60;const pts=vals.map((v,i)=>`${(i/(vals.length-1))*W},${H-6-(mx===mn?.5:(v-mn)/(mx-mn))*(H-12)}`);spark=`<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Birikim değişimi"><polyline points="${pts.join(' ')}" fill="none" stroke="var(--gold)" stroke-width="2"/></svg>`}

    ${goalSec()}
    ${assetGroups(rows).map(g=>{const lot=r=>`<div class="row tap" data-act="editasset" data-id="${r.id}"><div class="main"><div class="t">${r.type==='esya'?esc(r.name||'Araç / eşya'):nfq.format(r.qty)+' '+esc(ASSET_TYPES[r.type]||r.type)}${r.lent?` · ${esc(r.who||'?')}`:''}</div><div class="s">${r.type==='esya'?'Elle girilen tahmini değer':r.type==='tl'?'TL birikim':r.pr?'Birim '+TL2(r.pr):'Fiyat yok'}${r.lent&&r.owner?' · '+esc(r.owner)+' birikimi':''}${r.lent&&r.since?' · '+fmtDY(r.since)+' verdim':''}${r.lent&&r.dueDate?` · geri ${fmtDY(r.dueDate)}`:''}${r.note?' · '+esc(r.note):''}</div>${r.costTL>0?`<div class="small muted">${r.buyDate?fmtDY(r.buyDate)+' · ':''}alış ${TL(r.costTL)}</div>${pnlLine(pnl([r],P))}`:''}</div><div class="amt">${TL(r.val)}</div></div>`;

      ${types.map(t=>{const L=g.rows.filter(r=>r.type===t);const q=L.reduce((a,r)=>a+r.qty,0),v=L.reduce((a,r)=>a+r.val,0);const C=L.filter(r=>r.costTL>0);const cq=C.reduce((a,r)=>a+r.qty,0),ct=C.reduce((a,r)=>a+r.costTL,0);
        if(L.length===1)return lot(L[0]);
        return `<div class="atype"><div class="sumline" style="font-weight:700"><span>${nfq.format(q)} ${esc(ASSET_TYPES[t]||t)} <span class="muted" style="font-weight:500">· ${L.length} alış</span></span><b>${TL(v)}</b></div>

function matchMerchant(raw){const k=normKey(raw);if(!k)return null;let best=null,bk='';Object.entries(S.merch).forEach(([mk,m])=>{if(k===mk||k.startsWith(mk+' ')||k.split(' ')[0]===mk){if(mk.length>bk.length){best=m;bk=mk}}});return best}
/* bölüştürülmüş harcamalar (aynı groupId) tek harcama gibi karşılaştırılır */
function groupedTx(){const g={};const out=[];S.tx.forEach(x=>{if(x.groupId){if(!g[x.groupId]){g[x.groupId]={...x,amount:0};out.push(g[x.groupId])}g[x.groupId].amount+=x.amount}else out.push(x)});return out}
let DUPUSED=new Set();
function dupState(r){
  const type=r.kind==='gelir'?'gelir':'gider';const amt=r.kind==='iade'?-r.amount:r.amount;let st=null;
  for(const x of groupedTx()){if(x.type!==type||Math.abs(x.amount-amt)>0.01)continue;const dd=Math.abs(daysBetween(x.date,r.date));if(dd>2)continue;const a=firstWord(x.merchant),b=firstWord(r.merchant);if(dd<=1&&(a===b||!a||!b)){if(DUPUSED.has(x.id)){st="similar";continue}DUPUSED.add(x.id);return 'dup'}st='similar'}
  return st;
}

function rowFromAI(r,src,isCard){
  const inst=Math.max(1,Math.round(num(r.installments)||1)),no=Math.max(1,Math.round(num(r.installment_no)||1));
  let amount=Math.abs(trAmount(r.amount)),date=/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')?r.date:today();let extra={};
  let per=amount;if(inst>1){const tot=trAmount(r.total_amount);amount=tot>per*1.5?tot:per*inst;per=amount/inst;
    if(no>1){const cd=cardById(srcParse(src).cardId);let nd=date;if(cd&&hasDays(cd)){const lc=lastCut(cd);if(date<=lc)nd=cutFor(cd,addDays(lc,1))}extra={nextDate:nd,instDone:no-1}}}
  const m=matchMerchant(r.merchant),ai=parseCat(r.category);const hp=holderPerson(r.holder);
  const row={merchant:String(r.merchant||'Bilinmeyen').trim(),amount:r2(amount),per:r2(per),no,date,inst,...extra,kind:r.income?(isCard?'iade':'gelir'):'gider',

/* parçalar arası tekrar: sadece önceki parçanın SONU ile bu parçanın BAŞI aynıysa o kadar satırı at. Aynı gün aynı yerde aynı tutarda birden çok işlem (ör. 8× ANPA 1.179,60) korunur. */
function dedupeChunks(chunks){const key=r=>[r.date,r2(Math.abs(trAmount(r.amount))),firstWord(r.merchant)].join('|');const out=[];let prev=[];
  chunks.forEach((arr,ci)=>{const ks=arr.map(key);let L=0;if(ci>0){for(let n=Math.min(prev.length,ks.length);n>0;n--){if(ks.slice(0,n).every((k,i)=>k===prev[prev.length-n+i])){L=n;break}}}
    arr.forEach((r,i)=>{if(i>=L)out.push(r)});prev=ks});return out}

async function saveReview(){
  const rows=RV.rows.filter(r=>r.on);const ts=Date.now();let learned=false;
  const list=rows.flatMap((r,i)=>{const ps=srcParse(r.src);const c=parseCat(r.cat)||{category:'Diğer',sub:''};
    if(r.kind==='gelir')return {id:newId(),type:'gelir',amount:r.amount,date:r.date,merchant:r.merchant,source:r.source,...ps,via:RV.mode,ts:ts+i};
    const pin=RV.mode==='stmt'&&(r.inst||1)===1?{stmtCut:RV.end}:{};
    const mine=r.personId===ME;
    if(mine&&r.remember&&!r.known){const key=normKey(r.merchant);if(key){S.merch[key]={category:c.category,sub:c.sub};learned=true}}
    const base={type:'gider',date:r.date,merchant:r.merchant,...ps,inst:r.inst||1,nextDate:r.nextDate,instDone:r.instDone,via:RV.mode,ts:ts+i,...pin};
    const sign=r.kind==='iade'?-1:1;const n=r.inst||1;const share=r.splitP&&r.splitAmt>0?Math.min(r.splitAmt*n,r.amount):0;
    if(share>0&&r.splitP!==r.personId){const gid=newId();return [clean({...base,id:newId(),groupId:gid,amount:sign*r2(r.amount-share),personId:r.personId,category:mine?c.category:'',sub:mine?c.sub:''}),clean({...base,id:newId(),groupId:gid,amount:sign*r2(share),personId:r.splitP,category:'',sub:''})].filter(t=>Math.abs(t.amount)>0.004)}
    return [clean({...base,id:newId(),amount:sign*r.amount,category:mine?c.category:'',sub:mine?c.sub:'',personId:r.personId})];
  });
  const info=RV;
  try{
    if(list.length)await saveTx(list);if(learned)await saveMerch();
    if(info.mode==='stmt'){const card=info.card;const upd={...card};let ch=false;
      if(info.limit&&!card.limit){upd.limit=info.limit;ch=true}
      const cuts={...(card.cuts||{})};if(info.end&&info.due){cuts[info.end]=info.due;ch=true}if(info.nextCut&&info.nextDue){cuts[info.nextCut]=info.nextDue;ch=true}upd.cuts=cuts;
      if(info.nextCut&&info.nextDue){upd.cutDay=parse(info.nextCut).getDate();upd.dueDay=parse(info.nextDue).getDate();ch=true}
      else if(!hasDays(card)&&info.due){upd.cutDay=parse(info.end).getDate();upd.dueDay=parse(info.due).getDate();ch=true}
      if(ch)await put(upd);
      /* ekstrede eşleşen tek çekimlik harcamalar bu ekstreye sabitlenir; kesim tarihi tatil yüzünden kaysa da yeni döneme karışmaz */
      const pinIds=new Set();info.matched.forEach(({c})=>{if(c.pn!==1)return;if(c.groupId)S.tx.filter(t=>t.groupId===c.groupId).forEach(t=>pinIds.add(t.id));else pinIds.add(c.id)});
      const pins=S.tx.filter(t=>pinIds.has(t.id)&&t.stmtCut!==info.end).map(t=>({...t,stmtCut:info.end}));if(pins.length)await saveTx(pins);
      const cutKey=hasDays(upd)?cutFor(upd,info.end):info.end;
      const ex=S.stmts.find(s=>s.cardId===card.id&&s.cut===cutKey);
      await put({...(ex||{}),id:ex?.id,k:'stmt',cardId:card.id,cut:cutKey,due:info.due||undefined,checked:true,bankTotal:info.bankTotal??undefined,paid:!!ex?.paid});
    }
    const cats=[...new Set(list.filter(t=>t.type==='gider'&&t.personId===ME).map(t=>t.category))];
    RV=null;closeSheet();setTimeout(()=>budgetAlert(cats,`${list.length} kayıt eklendi`),300);
  }catch(e){toast('Kaydedilemedi: '+(e?.message||'hata'))}
}

    case 'card':{const cut=Math.round(num(g('cutDay'))),due=Math.round(num(g('dueDay')));if(cut<1||cut>31||due<1||due>31){toast('Günler 1-31 arası olmalı');return}const ex=cardById(g('id'));
      const cuts=fixCuts(ex?.cuts,cut,due,ex?.cutDay);
      await put({...(ex||{}),id:g('id')||undefined,k:'card',name:g('name').trim(),limit:g('limitOf')?0:(num(g('limit'))||0),limitOf:g('limitOf')||'',cutDay:cut,dueDay:due,cuts,holderId:g('holderId')||'',ticari:fd.has('ticari'),ts:ex?.ts||Date.now()});closeSheet();toast('Kart kaydedildi');break}
    case 'paycard':{const c=cardById(g('cardId'));const amt=num(g('amount'));if(amt<=0)return;const d=g('date')||today();await saveTx([{id:newId(),type:'transfer',amount:amt,date:d,account:g('account')||'',toCardId:c.id,merchant:`${c.name} borç ödemesi`,ts:Date.now(),via:'manuel'}]);
      const st=cardState(c);if(st&&!st.noDays&&!st.last.paid&&st.last.total>0.5&&amt>=st.last.total-1){const ex=S.stmts.find(x=>x.cardId===c.id&&x.cut===st.last.cut);await put({...(ex||{}),id:ex?.id,k:'stmt',cardId:c.id,cut:st.last.cut,paid:true})}
      closeSheet();toast('Ödeme kaydedildi');break}
    case 'crange':{cardRange[g('id')]={from:g('from')||'',to:g('to')||''};const c=cardById(g('id'));openSheet(head(esc(c.name))+cardBlock(c,cardState(c)));break}
    case 'paystmt':{const c=cardById(g('cardId'));const cut=g('cut');const amt=num(g('amount'));
      if(amt>0)await saveTx([{id:newId(),type:'transfer',amount:amt,date:today(),account:g('account')||'',toCardId:c.id,merchant:`${c.name} ekstre ödemesi`,ts:Date.now(),via:'manuel'}]);
      const ex=S.stmts.find(s=>s.cardId===c.id&&s.cut===cut);await put({...(ex||{}),id:ex?.id,k:'stmt',cardId:c.id,cut,paid:true});closeSheet();toast('Ekstre ödendi');break}
    case 'accbal':{const a=S.accounts.find(x=>x.id===g('id'));await put({...a,balance:num(g('balance')),balanceAt:Date.now()});closeSheet();toast('Bakiye güncellendi');break}
    case 'account':{const fromSettings=!!f.closest('.stack');await put({k:'account',name:g('name').trim(),balance:num(g('balance')),balanceAt:g('balance')?Date.now():0,ts:Date.now()});if(fromSettings)setTimeout(settingsSheet,250);else{closeSheet();toast('Hesap eklendi')}break}
    case 'accgrp':{const a=S.accounts.find(x=>x.id===g('id'));const gr=String(g('group')||'').trim();const o={...a};if(gr)o.group=gr;else delete o.group;await put(o);closeSheet();toast(gr?`${gr} grubuna eklendi`:'Gruptan çıkarıldı');break}
    case 'accren':{const a=S.accounts.find(x=>x.id===g('id'));const nn=String(g('name')).trim();if(!nn||nn===a.name)return;const old=a.name;const list=S.tx.filter(t=>t.account===old||t.toAccount===old).map(t=>({...t,account:t.account===old?nn:t.account,toAccount:t.toAccount===old?nn:t.toAccount}));await put({...a,name:nn});if(list.length)await saveTx(list);closeSheet();toast('Hesap adı değişti');break}
    case 'debt':{const ex=S.debts.find(d=>d.id===g('id'));const payments=[...(ex?.payments||[])];const pay=num(g('pay'));if(pay>0)payments.push({date:g('payDate')||today(),amount:pay});
      const o={...(ex||{}),id:g('id')||undefined,k:'debt',dir:g('dir'),who:g('who').trim(),amount:num(g('amount')),cur:g('cur')||'TRY',dueDate:g('dueDate')||'',note:g('note')||'',payments,paid:!!ex?.paid};if(!o.paid&&debtLeft(o)<=0){o.paid=true;o.closedAt=today()}await put(o);closeSheet();toast('Kaydedildi');break}
    case 'plan':await put({id:g('id')||undefined,k:'plan',name:g('name'),who:g('who'),total:num(g('total')),installment:num(g('installment')),day:Math.round(num(g('day')))||1,already:num(g('already')),account:g('account')||''});closeSheet();toast('Kaydedildi');break;
    case 'rec':{const ex=S.recs.find(r=>r.id===g('id'));const no=Math.round(num(g('no')));await put({...(ex||{}),id:g('id')||undefined,k:'rec',dir:g('dir'),name:g('name').trim(),amount:num(g('amount')),day:Math.round(num(g('day')))||1,startMonth:no?planMonth:(ex?.startMonth||planMonth),startNo:no||undefined,count:Math.round(num(g('count')))||undefined,account:g('account')||'',asset:fd.has('asset')});closeSheet();toast('Kaydedildi');break}
    case 'sub':{const E=subsEdit();const id=g('id');const it={id:id||newId(),name:g('name').trim(),amt:num(g('amount'))>0?r2(num(g('amount'))):0,note:g('note').trim()};if(!it.name)return;
      if(id)E.items=E.items.map(x=>x.id===id?it:x);else E.items.push(it);await subsSave(E);subsEditSheet();toast(it.note?`${it.note} kaydedildi`:'Kaydedildi');break}
    case 'payrec':{const r=S.recs.find(x=>x.id===g('id'));const mk=g('mk');const o=recOcc(r,mk);const amt=Math.abs(num(g('amount')));if(!(amt>0))return;const gel=r.dir==='gelir';
      const full=fd.has('close')||amt>=o.amount-0.5;
      await saveTx([{id:newId(),type:gel?'gelir':'odeme',amount:amt,date:g('date')||today(),account:g('account')||'',merchant:r.name,source:gel?(incomeSrc().includes(r.name)?r.name:'Diğer'):undefined,recId:r.id,recMonth:mk,...(full?{}:{recPart:true}),ts:Date.now(),via:'manuel'}]);
      closeSheet();toast(full?(gel?'Geldi olarak işaretlendi':'Ödendi olarak işaretlendi'):`${TL(amt)} kaydedildi · kalan ${TL(o.amount-amt)}`);break}
    case 'paysched':{const x=S.tx.find(t=>t.id===g('id'));if(!x)return;const amt=Math.abs(num(g('amount')));if(!(amt>0))return;const d=g('date')||today();const acc=g('account')||'';
      if(amt>=x.amount-0.5)await saveTx([{...x,date:d,account:acc,ts:Date.now()}]);
      else await saveTx([{...x,id:newId(),amount:r2(amt),date:d,account:acc,ts:Date.now()},{...x,amount:r2(x.amount-amt)}]);
      {const gw=x.type==='gelir'||x.type==='tahsilat'?'geldi':'ödendi';closeSheet();toast(amt>=x.amount-0.5?gw[0].toUpperCase()+gw.slice(1):`${TL(amt)} ${gw} · kalan ${TL(x.amount-amt)} ${fmtD(x.date)} tarihinde bekliyor`)}break}
    case 'paydebt':{const dd=S.debts.find(x=>x.id===g('id'));if(!dd)return;const amt=Math.abs(num(g('amount')));if(!(amt>0))return;const d=g('date')||today();const left=debtLeft(dd);
      const gel=dd.dir==='alacak';const tx={id:newId(),type:gel?'tahsilat':'odeme',amount:r2(amt),date:d,account:g('account')||'',merchant:gel?`${dd.who} ödedi`:`${dd.who} borç ödemesi`,debtId:dd.id,ts:Date.now(),via:'manuel'};await saveTx([tx]);
      const full=amt>=left-0.5;await put({...dd,payments:[...(dd.payments||[]),{date:d,amount:r2(amt),txId:tx.id}],...(full?{paid:true,closedAt:d}:{})});
      closeSheet();toast(full?(gel?'Alacak kapandı':'Borç kapandı'):`${TL(amt)} ${gel?'geldi':'ödendi'} · kalan ${TL(left-amt)}`);break}
    case 'payplan':{const pl=S.plans.find(p=>p.id===g('id'));if(!pl)return;const amt=Math.abs(num(g('amount')));if(!(amt>0))return;const mk=g('mk');
      await saveTx([{id:newId(),type:'gelir',amount:r2(amt),date:g('date')||today(),merchant:pl.name,source:'Araba taksiti',planId:pl.id,planMonth:mk,account:g('account')||'',ts:Date.now(),via:'manuel'}]);
      closeSheet();toast(`${TL(amt)} geldi olarak kaydedildi`);break}
    case 'recdone':{const r=S.recs.find(x=>x.id===g('id'));const mk=g('mk');await saveTx([{id:newId(),type:r.dir==='gelir'?'gelir':'odeme',amount:Math.abs(num(g('amount'))),date:g('date')||today(),account:g('account')||'',merchant:r.name,source:r.dir==='gelir'?(incomeSrc().includes(r.name)?r.name:'Diğer'):undefined,recId:r.id,recMonth:mk,ts:Date.now(),via:'manuel'}]);closeSheet();toast('İşaretlendi');break}
    case 'asset':{const lent=fd.has('lent');const ow=String(g('owner')||'').trim();await put({id:g('id')||undefined,k:'asset',type:g('type'),qty:num(g('qty')),note:g('note')||'',value:g('type')==='esya'?num(g('value'))||0:undefined,name:g('type')==='esya'?String(g('name')||'').trim():undefined,owner:ow&&ow!=='Kendim'?ow:'',buyDate:g('buyDate')||'',costTL:num(g('costTL'))||0,usdRate:num(g('usdRate'))||0,eurRate:num(g('eurRate'))||0,lent,who:lent?String(g('who')||'').trim():'',since:lent?g('since')||'':'',dueDate:lent?g('dueDate')||'':''});closeSheet();setTimeout(assetsSheet,250);break}
    case 'prices':{const P=S.prices||{};const cur={};PRICED.forEach(k=>{const v=num(g(k));cur[k]=v>0?v:(P[k]||undefined)});const hist={...(P.history||{})};hist[today()]=clean(cur);await db.doc('market/prices').set(clean({...cur,updatedAt:new Date().toISOString(),source:'Elle girildi',history:hist}));closeSheet();toast('Fiyatlar güncellendi');break}
    case 'pay':{const t={id:newId(),type:'tahsilat',personId:g('personId'),amount:Math.abs(num(g('amount'))),date:g('date')||today(),account:g('account')||'',merchant:'Ödeme aldım',ts:Date.now(),via:'manuel'};
      /* sıradaki kart payından fazlaysa: fazlası bir sonraki ödemesinden düşülsün mü, sor */
      const O=owedByDue();const o=_owAll.find(x=>x.pid===t.personId);const first=o?.lines.find(l=>l.left>0.5);
      if(first&&t.amount>first.left+1){PENDPAY={t,first:first.left,next:o.lines.filter(l=>l.left>0.5&&l!==first),line:first};payAsk();break}
      await saveTx([t]);closeSheet();toast('Kaydedildi');break}
    case 'opening':{const p=S.persons.find(x=>x.id===g('id'));await put({...p,opening:num(g('opening')),since:g('since')||START()});closeSheet();toast('Kaydedildi');break}
    case 'budget':{const cat=g('category');const ex=S.budgets.find(b=>b.category===cat);await put({...(ex||{}),id:ex?.id,k:'budget',category:cat,limit:num(g('limit')),rollover:fd.has('rollover'),since:ex?.since||today().slice(0,7)});setTimeout(settingsSheet,250);break}
    case 'person':await put({k:'person',name:g('name').trim(),opening:0,ts:Date.now()});setTimeout(settingsSheet,250);break;
    case 'catadd':case 'catnew':{const t=catTree();const m=String(g('main')||'').trim();const sb=String(g('sub')||'').trim();if(!m)return;if(!t[m])t[m]=[];if(sb&&!t[m].includes(sb))t[m].push(sb);await saveTree(t);
      if(f.dataset.form==='catnew'){if(catEditMode||!catTarget)openCatPop(undefined,sb?m:undefined);else setCat(catVal(m,sb))}else{toast('Eklendi');setTimeout(()=>{settingsSheet();const d=[...document.querySelectorAll('.catedit')].find(x=>x.querySelector('summary span')?.textContent===m);if(d)d.open=true},150)}break}
    case 'lump':{const c=cardById(g('id'));const mode=g('mode');let cut,date;
      if(mode==='stmt'){cut=g('cut');const due=g('due');if(!cut||!due){toast('Tarihleri gir');return}date=cut;const cuts={};Object.entries(c.cuts||{}).forEach(([k,v])=>{if(k<cut&&k.slice(0,7)!==cut.slice(0,7))cuts[k]=v});cuts[cut]=due;await put({...c,cuts,cutDay:parse(cut).getDate(),dueDay:parse(due).getDate()});c.cuts=cuts;c.cutDay=parse(cut).getDate();c.dueDay=parse(due).getDate()}
      else{const st=cardState(c);cut=st&&!st.noDays?st.open.cut:'';date=today()}
      const old=S.tx.filter(t=>t.cardId===c.id&&t.stmtCut===cut&&(t.lump===mode||(mode==='stmt'&&t.lump==='open'))).map(t=>t.id);
      const pids=[ME,...S.persons.map(p=>p.id)];const ts=Date.now();
      const list=pids.map((pid,i)=>{const v=num(g('a_'+pid));if(!(v>0))return null;return clean({id:newId(),type:'gider',cardId:c.id,account:'',date,amount:v,personId:pid,merchant:mode==='stmt'?`${c.name} ekstresi (${fmtD(cut)})`:`${c.name} dönem içi kullanım`,category:pid===ME?'Diğer':'',sub:'',lump:mode,stmtCut:cut||undefined,inst:1,via:'lump',ts:ts+i})}).filter(Boolean);
      await saveTx(list,old);if(mode==='stmt'){const ex=S.stmts.find(x=>x.cardId===c.id&&x.cut===cut);await put({...(ex||{}),id:ex?.id,k:'stmt',cardId:c.id,cut,due:g('due'),checked:true,paid:!!ex?.paid})}
      closeSheet();toast('Kaydedildi');break}
    case 'bankcmp':{const c=cardById(g('id'));const st=cardState(c);await put({...c,bankCheck:{cut:st.open.cut,amount:num(g('amount')),at:today()}});closeSheet();break}
    case 'apikey':{ls.set('kd_apikey',String(g('key')||'').trim());toast('Anahtar kaydedildi');break}
    case 'prodedit':{const p=S.prod.map[g('pid')];p.name=g('name').trim()||p.name;p.group=g('group');await saveProd();_ps=null;closeSheet();render();break}
    case 'excessback':{const x=S.tx.find(t=>t.id===g('id'));const v=num(g('amount'));if(!(v>0)){toast('Tutar gir');return}
      await saveTx([{id:newId(),type:'verdim',personId:x.personId,amount:v,date:g('date')||today(),account:g('account')||'',merchant:'Fazla ödemesini geri verdim',excessOf:x.id,ts:Date.now(),via:'manuel'}]);closeSheet();toast('Kaydedildi');break}
    case 'transfer':{const from=g('from'),to=g('to');const amt=num(g('amount'));if(!(amt>0)){toast('Tutar gir');return}if(from===to){toast('Nereden ve nereye aynı olamaz');return}
      const t={id:newId(),type:'transfer',amount:amt,date:g('date')||today(),account:from,toAccount:to,note:g('note')||'',merchant:`${from} → ${to}`,ts:Date.now(),via:'manuel'};await saveTx([t]);
      const fee=num(g('fee'));if(fee>0){await saveFee(t,fee);closeSheet();toast(`Transfer ve ${TL(fee)} ücret kaydedildi`)}else feeAsk(t);break}
    case 'fee':{const fee=num(g('fee'));if(PENDFEE&&fee>0){await saveFee(PENDFEE,fee);toast(`${TL(fee)} komisyon kaydedildi`)}else toast('Kaydedildi');PENDFEE=null;closeSheet();break}
    case 'catplan':{const mk=g('mk');const months={...(S.catplan?.months||{})};const cur={...(months[mk]||{})};
      f.querySelectorAll('input[name^="c_"]').forEach(inp=>{const c=inp.name.slice(2);const v=num(inp.value);if(String(Math.round(v))!==inp.dataset.orig||cur[c]!=null)cur[c]=Math.max(0,v)});
      months[mk]=cur;await put({id:'catplan',k:'catplan',months});S.catplan={months};toast('Plan kaydedildi');planSheet(mk);break}
    case 'quickin':{const amt=num(g('amount'));if(!(amt>0)){toast('Tutar gir');return}const acc=g('account')||'';
      await saveTx([clean({id:newId(),type:'gelir',amount:amt,date:g('date')||today(),source:g('source')||'Diğer',account:acc,merchant:String(g('merchant')||'').trim(),via:'hizli',ts:Date.now()})]);ls.set('kd_qa_acc',acc);closeSheet();toast(`${TL(amt)} gelir eklendi`);break}
    case 'quick':{const amt=num(g('amount'));if(!(amt>0)){toast('Tutar gir');return}const cv=g('cat');if(!cv){toast('Kategori seç');return}const c=parseCat(cv)||{category:'Diğer',sub:''};const pid=g('personId')||ME;const src=g('src')||'';
      await saveTx([clean({id:newId(),type:'gider',amount:amt,date:g('date')||today(),merchant:String(g('merchant')||'').trim(),...srcParse(src),personId:pid,category:pid===ME?c.category:'',sub:pid===ME?c.sub:'',inst:1,via:'hizli',ts:Date.now()})]);
      ls.set('kd_qa_src',src);closeSheet();budgetAlert(pid===ME?[c.category]:[],`${TL(amt)} eklendi`);break}
    case 'ss':await runSS(fd);break;
    case 'stmt':await runStmt(fd);break;
    case 'fis':await runFis();break;
  }}catch(err){toast('Kaydedilemedi: '+(err?.message||'hata'))}
});
boot();
</script>
